# Full QUIC interoperability test suite with all available implementations
# This allows testing the Zig QUIC implementation against all other implementations
#
# Usage:
#   docker compose -f examples/interop/docker-compose.full.yml build zig-qns
#   docker compose -f examples/interop/docker-compose.full.yml pull
#
#   # Test zig as server with quic-go as client:
#   SERVER=zig CLIENT=quic-go TESTCASE=handshake docker compose -f examples/interop/docker-compose.full.yml up
#
#   # Test zig as client with ngtcp2 as server:
#   SERVER=ngtcp2 CLIENT=zig TESTCASE=transfer docker compose -f examples/interop/docker-compose.full.yml up
#
# Available implementations:
#   Both roles: zig, quic-go, ngtcp2, mvfst, quiche, kwik, picoquic, aioquic, neqo, msquic, xquic, lsquic, quinn, s2n-quic, go-x-net
#   Server only: nginx, haproxy
#   Client only: chrome
#
# Test cases: handshake, transfer, retry, http3, keyupdate, resumption, zerortt, connectionmigration, rebind-port, rebind-addr, v2, chacha20, multiconnect

services:
  sim:
    image: martenseemann/quic-network-simulator
    container_name: ${COMPOSE_PROJECT_NAME}_sim
    hostname: sim
    stdin_open: true
    tty: true
    volumes:
      - ./quic-network-simulator/logs/sim:/logs
    environment:
      - SCENARIO=${SCENARIO:-simple-p2p --delay=10ms --bandwidth=10Mbps --queue=25}
    cap_add:
      - NET_ADMIN
    expose:
      - '57832'
    networks:
      leftnet:
        ipv4_address: 193.167.0.2
        ipv6_address: fd00:cafe:cafe:0::2
      rightnet:
        ipv4_address: 193.167.100.2
        ipv6_address: fd00:cafe:cafe:100::2

  # Zig QUIC implementation (local build)
  zig-server:
    build:
      context: ../../
      dockerfile: examples/interop/zig-qns/Dockerfile
    image: zig-qns:local
    container_name: ${COMPOSE_PROJECT_NAME}_zig_server
    hostname: server
    stdin_open: true
    tty: true
    volumes:
      - ./quic-network-simulator/logs/server:/logs
      - ./quic-interop-runner/certs:/certs:ro
      - ./quic-network-simulator/www:/www:ro
    environment:
      - ROLE=server
      - TESTCASE=${TESTCASE:-handshake}
    depends_on:
      - sim
    cap_add:
      - NET_ADMIN
    networks:
      rightnet:
        ipv4_address: 193.167.100.100
        ipv6_address: fd00:cafe:cafe:100::100
    extra_hosts:
      - 'client4:193.167.0.100'
      - 'client6:fd00:cafe:cafe:0::100'
      - 'client46:193.167.0.100'
      - 'client46:fd00:cafe:cafe:0::100'
    profiles:
      - zig

  zig-client:
    build:
      context: ../../
      dockerfile: examples/interop/zig-qns/Dockerfile
    image: zig-qns:local
    container_name: ${COMPOSE_PROJECT_NAME}_zig_client
    hostname: client
    stdin_open: true
    tty: true
    volumes:
      - ./quic-network-simulator/logs/client:/logs
      - ./quic-interop-runner/certs:/certs:ro
      - ./quic-network-simulator/downloads:/downloads
    environment:
      - ROLE=client
      - REQUESTS=${REQUESTS:-https://server4/index.html}
      - TESTCASE=${TESTCASE:-handshake}
    depends_on:
      - sim
    cap_add:
      - NET_ADMIN
    networks:
      leftnet:
        ipv4_address: 193.167.0.100
        ipv6_address: fd00:cafe:cafe:0::100
    extra_hosts:
      - 'server4:193.167.100.100'
      - 'server6:fd00:cafe:cafe:100::100'
      - 'server46:193.167.100.100'
      - 'server46:fd00:cafe:cafe:100::100'
    profiles:
