# Trivy secret-scan allowlist.
#
# The paths below are public RFC text files checked in as protocol references.
# They contain example PEM blocks from the RFCs, not repository credentials.
allow-rules:
  - id: public-rfc-private-key-examples
    description: Public X.509 RFC example private keys
    path: "(^|/)rfc(7468|8410)\\.txt$"
