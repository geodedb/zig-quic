name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, zig ${{ matrix.zig }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: ['0.15.1']

    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Zig version
        run: zig version

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      # Note: Linux integration tests require root/CAP_NET_RAW and are not run on CI.

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zcap-${{ runner.os }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
            include/
          retention-days: 7

  build-linux-xdp:
    name: Build (ubuntu-latest, zig ${{ matrix.zig }}, -Dxdp=true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.15.1']
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1

      - name: Zig version
        run: zig version

      - name: Build (xdp)
        run: zig build -Dxdp=true

      - name: Upload artifacts (xdp)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zcap-ubuntu-xdp-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
            include/
          retention-days: 7

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig 0.15.1
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      - name: Build
        run: zig build
      - name: Unit tests
        run: zig build test
      - name: Build fuzzers
        run: zig build fuzz
      - name: Build bench
        run: zig build bench
      - name: Doccheck
        run: zig build tools && ./zig-out/bin/doccheck
      - name: Ensure GAP updated when code changes
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}... | grep -E '\.(zig|zon|yml)$' || true)
          if [ -n "$CHANGED" ]; then
            echo "Code changes detected:"
            echo "$CHANGED"
            echo "Checking GAP.md update..."
            git diff --name-only origin/${{ github.base_ref }}... | grep -q docs/GAP.md || { echo "GAP.md not updated"; exit 1; }
            zig build tools
            ./zig-out/bin/update-gap --summary "CI: code changed in PR"
          fi

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        zig: [0.15.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig }}
      - name: Build
        run: zig build -Drelease-safe=false
      - name: Run tests
        run: zig build test
      - name: Build fuzzers
        run: zig build fuzz
      - name: Build bench
        run: zig build bench
      - name: Build tools
        run: zig build tools
      - name: Doccheck
        run: ./zig-out/bin/doccheck
      - name: Ensure GAP updated on code changes
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          if git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '\\.(zig|zon|md|yml)$' >/dev/null; then
            if ! git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.sha }} | grep -E '^docs/GAP.md$' >/dev/null; then
              echo "GAP.md not updated for code changes" >&2
              exit 1
            fi
          fi

  dev-release:
    name: Create or update dev release with tarball
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create source tarball
        run: git archive --format=tar.gz -o quic-dev.tar.gz --prefix=quic-dev/ HEAD
      - name: Create/update dev release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: dev
          name: dev
          body: 'Automated dev release for ${{ github.sha }}'
          prerelease: true
          allowUpdates: true
          artifacts: quic-dev.tar.gz
          artifactErrorsFailBuild: true
