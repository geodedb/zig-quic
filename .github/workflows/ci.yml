name: CI

on:
  push:
    branches: [main, "**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }}, zig ${{ matrix.zig }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: ["0.14.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: de-vri-es/setup-git-credentials@v2
        with:
          credentials: ${{secrets.GIT_CREDENTIALS}}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          upstream-cache: https://spyder.cachix.org
      - uses: DeterminateSystems/flake-checker-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: spyder
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
          key: ${{ runner.os }}-zig-${{ matrix.zig }}-${{ hashFiles('build.zig', 'src/**/*.zig', 'tests/**/*.zig') }}
          restore-keys: |
            ${{ runner.os }}-zig-${{ matrix.zig }}-

      - name: Zig version
        run: zig version

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      # Note: Linux integration tests require root/CAP_NET_RAW and are not run on CI.

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zcap-${{ runner.os }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
            include/
          retention-days: 7

  build-linux-xdp:
    name: Build (ubuntu-latest, zig ${{ matrix.zig }}, -Dxdp=true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ["0.14.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: de-vri-es/setup-git-credentials@v2
        with:
          credentials: ${{secrets.GIT_CREDENTIALS}}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          upstream-cache: https://spyder.cachix.org
      - uses: DeterminateSystems/flake-checker-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: spyder
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: |
            zig-cache
          key: linux-zig-${{ matrix.zig }}-xdp-${{ hashFiles('build.zig', 'src/**/*.zig', 'tests/**/*.zig') }}
          restore-keys: |
            linux-zig-${{ matrix.zig }}-xdp-

      - name: Zig version
        run: zig version

      - name: Build (xdp)
        run: zig build -Dxdp=true

      - name: Upload artifacts (xdp)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zcap-ubuntu-xdp-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/
            zig-out/lib/
            include/
          retention-days: 7
