name: interop-smoke

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Comma separated testcases (e.g. handshake,transfer)'
        required: false
        default: 'handshake,transfer'
      impl:
        description: 'Peer implementation (e.g. quic-go, quiche, all)'
        required: false
        default: 'quic-go'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'src/**'
      - 'scripts/interop_local.sh'
      - 'scripts/interop_full.sh'
      - 'examples/interop/zig-qns/Dockerfile'
      - 'examples/interop/docker-compose.*.yml'
      - '.github/workflows/interop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'src/**'
      - 'scripts/interop_*.sh'
      - 'examples/interop/**'
      - '.github/workflows/interop.yml'

jobs:
  smoke:
    # Auto on push/PR when files change; always on manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[interop]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: spyderorg/workflows/.github/actions/nix-setup@main
        with:
          git-credentials: ${{ secrets.GIT_CREDENTIALS }}
          gh-access-token: ${{ secrets.GH_ACCESS_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.1
      
      - name: Build & Unit Tests
        run: zig build test --summary all
      
      - name: Build Zig CLI (qns-endpoint)
        run: zig build -Drelease-safe=true cli
      
      - name: Build interop image
        run: docker build -t zig-qns:local -f examples/interop/zig-qns/Dockerfile .
      
      - name: Run interop tests
        env:
          TESTS: ${{ github.event.inputs.tests || 'handshake,transfer' }}
          IMPL: ${{ github.event.inputs.impl || 'quic-go' }}
          RETRY_TOKEN_SECRET: ${{ secrets.RETRY_TOKEN_SECRET }}
        run: |
          if [[ "$IMPL" == "all" ]]; then
            # Run quick mode against major implementations
            chmod +x scripts/interop_full.sh
            scripts/interop_full.sh quick
          else
            # Run against specific implementation
            bash scripts/interop_local.sh
          fi
      
      - name: Upload interop logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: |
            examples/interop/quic-interop-runner/logs
            examples/interop/quic-network-simulator/logs
            /tmp/interop_*.log
