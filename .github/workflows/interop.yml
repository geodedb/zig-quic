name: interop-smoke

on:
  workflow_dispatch:
    inputs:
      tests:
        description: 'Comma separated testcases (e.g. handshake,transfer)'
        required: false
        default: 'handshake,transfer'
      impl:
        description: 'Peer implementation (e.g. quic-go, quiche)'
        required: false
        default: 'quic-go'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'src/**'
      - 'scripts/interop_local.sh'
      - 'examples/interop/zig-qns/Dockerfile'
      - '.github/workflows/interop.yml'

jobs:
  smoke:
    # Auto on push only when commit message contains [interop]; always on manual dispatch
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[interop]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: 0.14.1
      - name: Build & Unit Tests
        run: zig build test --summary all
      - name: Build interop image
        run: docker build -t zig-qns:ci -f examples/interop/zig-qns/Dockerfile .
      - name: Run interop subset
        env:
          TESTS: ${{ github.event.inputs.tests || 'handshake,transfer' }}
          IMPL: ${{ github.event.inputs.impl || 'quic-go' }}
        run: bash scripts/interop_local.sh || true
      - name: Upload interop logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: examples/interop/quic-interop-runner/logs
