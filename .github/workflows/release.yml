name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: Build/Test/Fuzz (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zig: ['0.15.1']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Zig version
        run: zig version

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Build fuzzers
        run: make fuzz

      - name: Bench (build only)
        run: make bench

      - name: Tools + Doccheck
        run: make doccheck

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quic-${{ runner.os }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/**
          retention-days: 7

      - name: Package binaries (OS-specific archive)
        shell: bash
        run: |
          set -euo pipefail
          os="$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')"
          arch="$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')"
          zigv="${{ matrix.zig }}"
          name="quic-${os}-${arch}-zig-${zigv}"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'zig-out/bin/*' -DestinationPath 'dist/${name}.zip' -Force"
            echo "ARCHIVE_PATH=dist/${name}.zip" >> "$GITHUB_ENV"
            echo "ARCHIVE_NAME=${name}.zip" >> "$GITHUB_ENV"
          else
            tar -czf "dist/${name}.tar.gz" -C zig-out/bin .
            echo "ARCHIVE_PATH=dist/${name}.tar.gz" >> "$GITHUB_ENV"
            echo "ARCHIVE_NAME=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create source tarball
        run: git archive --format=tar.gz -o dist/source-${{ github.ref_name }}.tar.gz --prefix=quic-${{ github.ref_name }}/ ${{ github.sha }}
      - name: Create/Update Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          prerelease: ${{ contains(github.ref_name, '-') }}
