name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-matrix:
    name: Build/Test/Fuzz (${{ matrix.archive_os }}-${{ matrix.archive_arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (native)
          - runner: ubuntu-latest
            target: x86_64-linux-gnu
            archive_os: linux
            archive_arch: x86_64
            run_tests: true
          # Linux arm
          - runner: ubuntu-latest
            target: arm-linux-gnueabihf
            archive_os: linux
            archive_arch: arm
            run_tests: false
          # Linux arm64
          - runner: ubuntu-latest
            target: aarch64-linux-gnu
            archive_os: linux
            archive_arch: arm64
            run_tests: false
          # Linux riscv64
          - runner: ubuntu-latest
            target: riscv64-linux-gnu
            archive_os: linux
            archive_arch: riscv64
            run_tests: false
          # macOS x86_64 (cross)
          - runner: macos-latest
            target: x86_64-macos
            archive_os: macos
            archive_arch: x86_64
            run_tests: false
          # Windows arm64 (cross)
          - runner: windows-latest
            target: aarch64-windows-msvc
            archive_os: windows
            archive_arch: arm64
            run_tests: false
        zig: ['0.15.1']

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      - name: Install GNU Make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y

      - name: Zig version
        run: zig version

      - name: Build CLI (ReleaseSafe)
        run: zig build -Dtarget='${{ matrix.target }}' -Drelease-safe=true cli

      - name: Test
        if: matrix.run_tests
        run: make test

      - name: Build fuzzers
        if: matrix.run_tests
        run: make fuzz

      - name: Bench (build only)
        if: matrix.run_tests
        run: make bench

      - name: Tools + Doccheck
        if: matrix.run_tests
        run: make doccheck

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quic-${{ matrix.archive_os }}-${{ matrix.archive_arch }}-zig-${{ matrix.zig }}
          path: |
            zig-out/bin/**
          retention-days: 7

      - name: Package binaries (OS-specific archive)
        shell: bash
        run: |
          set -euo pipefail
          os='${{ matrix.archive_os }}'
          arch='${{ matrix.archive_arch }}'
          zigv='${{ matrix.zig }}'
          name="quic-${os}-${arch}-zig-${zigv}"
          mkdir -p dist
          if [ "${os}" = "windows" ]; then
            if command -v powershell >/dev/null 2>&1; then
              powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path 'dist' > $null; if (-Not (Test-Path 'zig-out/bin')) { throw 'zig-out/bin missing' }; Compress-Archive -Path 'zig-out/bin/*' -DestinationPath 'dist/${name}.zip' -Force"
            else
              echo "powershell not available for zip compression" >&2; exit 1
            fi
            echo "ARCHIVE_PATH=dist/${name}.zip" >> "$GITHUB_ENV"
            echo "ARCHIVE_NAME=${name}.zip" >> "$GITHUB_ENV"
          else
            if [ ! -d zig-out/bin ]; then echo 'zig-out/bin missing' >&2; exit 1; fi
            tar -czf "dist/${name}.tar.gz" -C zig-out/bin .
            echo "ARCHIVE_PATH=dist/${name}.tar.gz" >> "$GITHUB_ENV"
            echo "ARCHIVE_NAME=${name}.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_PATH }}
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: build-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create source tarball
        run: git archive --format=tar.gz -o dist/source-${{ github.ref_name }}.tar.gz --prefix=quic-${{ github.ref_name }}/ ${{ github.sha }}
      - name: Collect license and signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          for pat in LICENSE* COPYING* NOTICE*; do
            for f in $pat; do
              cp -v "$f" dist/
            done
          done
      - name: Create/Update Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
            dist/**/*.asc
            dist/**/*.sig
            dist/**/*.sha256
            dist/**/*.sha512
            dist/LICENSE*
            dist/COPYING*
            dist/NOTICE*
          prerelease: ${{ contains(github.ref_name, '-') }}
