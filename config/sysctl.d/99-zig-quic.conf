# zig-quic — system-level tuning for QUIC/UDP workloads
# Authoritative reference: docs/SYSTEM_TUNING.md
# Apply via: sudo scripts/tune-system.sh apply
# Revert via: sudo scripts/tune-system.sh revert

# --- UDP socket buffers (per-socket ceilings) ---
# 7 MB — ceiling for SO_RCVBUF / SO_SNDBUF on a QUIC endpoint.
# Matches quic-go's documented recommendation; preserved by downstream consumers.
net.core.rmem_max = 7340032
net.core.wmem_max = 7340032

# --- UDP socket buffers (per-socket defaults) ---
# Raises the floor for processes that do not explicitly setsockopt.
net.core.rmem_default = 2500000
net.core.wmem_default = 2500000

# --- NIC -> kernel softirq queue depth ---
# Prevents drops during burst arrivals on 10 GbE and above.
net.core.netdev_max_backlog = 5000

# --- System-wide UDP memory (pages) ---
# min / pressure / max. ~1 GB ceiling on 4K-page systems; safe at >= 4 GB RAM.
net.ipv4.udp_mem = 262144 524288 1048576

# --- Per-socket UDP memory floor under pressure ---
net.ipv4.udp_rmem_min = 16384
net.ipv4.udp_wmem_min = 16384

# --- Client-side ephemeral port range ---
# Important for connection-heavy clients; harmless on servers.
net.ipv4.ip_local_port_range = 1024 65535

# --- Pacing-aware qdisc ---
# Fair-queue is a no-op for non-pacing CC and gives pacing CC an honest time base.
# Requires sch_fq kernel module (ubiquitous on mainline kernels).
net.core.default_qdisc = fq

# --- Kernel-wide file descriptor ceiling ---
# Aligns with systemd LimitNOFILE=65536 and leaves headroom for multi-instance hosts.
fs.file-max = 1048576
