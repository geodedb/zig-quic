[package]
name = "quic-test-client"
version = "0.1.0"
edition = "2021"

[dependencies]
quinn = "0.11"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
