# Catalog jobs without rules default to except:merge_requests. These gates
# must also run in the MR pipeline that determines merge eligibility.
.component-verification:
  rules: &component-verification-rules
    - when: on_success

default:
  # Pin to Linux runners. Without the `linux` tag, jobs without an `image:`
  # directive (e.g. zig-format from included
  # components) can be picked up by the group's Hosted Windows Runner —
  # whose PowerShell shell-executor then tries to run our bash scripts and
  # fails. All Linux runners (Company Cluster, OVH Dedicated, Lab Servers)
  # carry both `company` and `linux`; the Windows runner does not.
  #
  # `x86` keeps every job on the x86_64 Linux pools (OVH Dedicated, AWS Spot).
  # The ARM lab runner also carries `company,linux`, and when `build` and its
  # consumers landed on different architectures the e2e jobs got binaries
  # they could not execute (`quic-client: Syntax error: ")" unexpected`) and
  # the perf gate compared aarch64 numbers to the x86_64 baseline
  # (`ENV MISMATCH`). Same tag devnw/zig/ldap uses.
  interruptible: true
  tags:
    - company
    - linux
    - x86

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      zig_version: "0.16.0"

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724

  # Release
  # job_token: create the release with CI_JOB_TOKEN. The default (glab)
  # mode needs a GITLAB_TOKEN with api scope; the project's token lacks it,
  # so create-release failed with 403 insufficient_scope on v0.1.45
  # (pipeline 2960599429) and no tag since v0.1.11 got a GitLab release.
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724

stages:
  - lint
  - build
  - test
  - e2e
  - fuzz
  - security
  - sbom
  - release
  - maintenance

variables:
  ZIG_VERSION: "0.16.0"

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version
  - |
    python3 - <<'PY'
    import json, os
    from pathlib import Path
    resources = {"cpu_affinity": sorted(os.sched_getaffinity(0))}
    for name in ("cpu.max", "memory.max", "cpuset.cpus.effective"):
        path = Path("/sys/fs/cgroup") / name
        if path.exists():
            resources[name] = path.read_text().strip()
    print("CI resources: " + json.dumps(resources))
    PY

# zig-format component override: inject Zig install before format check
zig-format:
  rules: *component-verification-rules
  before_script:
    - *install-zig
    - apt-get install -y --no-install-recommends git findutils
  script:
    # Own formatting for every tracked Zig file in one job, using the project compiler.
    - git ls-files -z '*.zig' | xargs -0 -r zig fmt --check
    - find src -name '*.zig' -print0 | xargs -0 -r -n1 zig ast-check

# Opt both SBOM jobs in together to preserve the scan's artifact dependency.
security-gitleaks:
  rules: *component-verification-rules

sbom-generate:
  rules: *component-verification-rules

sbom-scan:
  rules: *component-verification-rules

# E2E tests with multiple QUIC client implementations
# Tests Python (aioquic), Go (quic-go), Rust (quinn), and Zig clients
# Generate test certificates for E2E tests
# GitLab only uploads artifacts from inside $CI_PROJECT_DIR, so the e2e jobs'
# /tmp/{server,client}.log were never kept ("artifact path is not a subpath of
# project directory"). Copy them into the project dir and print the tail of
# the server log so a server crash is diagnosable from the job trace.
.collect-e2e-logs: &collect-e2e-logs
  - mkdir -p "$CI_PROJECT_DIR/e2e-logs"
  - cp /tmp/server.log /tmp/client.log "$CI_PROJECT_DIR/e2e-logs/" 2>/dev/null || true
  - echo "--- tail of server.log ---"; tail -n 100 "$CI_PROJECT_DIR/e2e-logs/server.log" 2>/dev/null || true

.generate-test-certs: &generate-test-certs
  - bash scripts/generate_interop_certs.sh .interop-certs
  - cp .interop-certs/cert.pem server-cert.pem
  - cp .interop-certs/key.pem server-key.pem

build:
  stage: build
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  # Each build mode retains its own artifacts. Parallel jobs must not
  # overwrite each other's cache with disjoint compiler outputs.
  cache: &quic-zig-cache
    key:
      prefix: "quic-zig-linux-x86_64-${ZIG_VERSION}-${CI_JOB_NAME_SLUG}-v1"
      files: [build.zig.zon]
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    - python3 scripts/test_ci_interop.py -v
    - python3 scripts/test_client_security.py -v
    # Shared executables run on other x86 runners; native CPU features are unsafe.
    - zig build -Dtarget=x86_64-linux-gnu -Dcpu=baseline
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

test:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache: *quic-zig-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    # Competing Debug compiler/test steps starve the 32-client handshake on
    # two-vCPU runners. Serialize graph steps; the test still runs 32 clients
    # with its unchanged handshake and echo deadlines.
    - zig build test -j1 --summary all

# Build the hash-pinned dependency's provider once and share the verified artifact.
# The explicit provisioning graph propagates setup failures and requires signatures.
fips-deps:
  stage: build
  image: debian:bookworm-slim
  variables:
    # Keep the explicit 3.x pin; releases/latest may name the 4.x series.
    OPENSSL_VERSION: "3.6.5"
  tags: [company, linux, x86]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  # Reuse the installation only while the dependency pin and provisioning
  # graph match. The installer verifies the version and active provider.
  cache:
    key:
      prefix: "quic-openssl-fips-3.6.5-bookworm-x86_64-v1"
      files: [build.zig.zon, build.zig]
    paths:
      - .openssl-fips/
    policy: pull-push
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential perl wget curl sudo gnupg dirmngr ca-certificates make git
    - *install-zig
    - python3 scripts/test_fips_provision.py
    # Import the upstream bundle; the pinned installer still checks the signer
    # against its pinned fingerprints before accepting any release.
    - wget -q https://www.openssl-library.org/source/pubkeys.asc -O /tmp/openssl-pubkeys.asc
    - gpg --batch --import /tmp/openssl-pubkeys.asc
  script:
    - |
      # Restored installations may have been built at another runner path.
      FIPS_PREFIX="$CI_PROJECT_DIR/.openssl-fips"
      if [ -x "$FIPS_PREFIX/bin/openssl" ]; then
        sed -i "s#^\.include .*/ssl/fipsmodule\.cnf\$#.include ${FIPS_PREFIX}/ssl/fipsmodule.cnf#" "$FIPS_PREFIX/ssl/openssl.cnf"
        FIPS_LIBDIR="$FIPS_PREFIX/lib64"
        [ -d "$FIPS_LIBDIR/ossl-modules" ] || FIPS_LIBDIR="$FIPS_PREFIX/lib"
        export OPENSSL_MODULES="$FIPS_LIBDIR/ossl-modules" LD_LIBRARY_PATH="$FIPS_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      fi
    - zig build provision-fips -Dfips=true -Dopenssl_path="$CI_PROJECT_DIR/.openssl-fips" --summary all
  artifacts:
    paths:
      - .openssl-fips/
    expire_in: 1 day

test-fips:
  stage: test
  image: debian:bookworm-slim
  tags: [company, linux, x86]
  needs:
    - job: fips-deps
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache: *quic-zig-cache
  before_script:
    - *install-zig
    # Relocate the shared provider artifact to this job's checkout path.
    - FIPS_PREFIX="$CI_PROJECT_DIR/.openssl-fips"
    - sed -i "s#^\.include .*/ssl/fipsmodule\.cnf\$#.include ${FIPS_PREFIX}/ssl/fipsmodule.cnf#" "$FIPS_PREFIX/ssl/openssl.cnf"
    - grep -q "^\.include ${FIPS_PREFIX}/ssl/fipsmodule\.cnf\$" "$FIPS_PREFIX/ssl/openssl.cnf"
    - FIPS_LIBDIR="$FIPS_PREFIX/lib64"; [ -d "$FIPS_LIBDIR/ossl-modules" ] || FIPS_LIBDIR="$FIPS_PREFIX/lib"
    - export OPENSSL_MODULES="$FIPS_LIBDIR/ossl-modules" LD_LIBRARY_PATH="$FIPS_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
    # Match the CLI to the artifact's libraries during certificate generation.
    - export PATH="$FIPS_PREFIX/bin:$PATH"
    - OPENSSL_PREFIX="$FIPS_PREFIX" bash scripts/verify-fips-provider.sh
  script:
    - OPENSSL_CONF="$CI_PROJECT_DIR/.openssl-fips/ssl/openssl.cnf" zig build test -j2 -Dfips=true -Dopenssl_path="$CI_PROJECT_DIR/.openssl-fips" --summary all

test-release-safe:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache: *quic-zig-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    - zig build test -j2 -Doptimize=ReleaseSafe --summary all

test-release-fast:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache: *quic-zig-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    - zig build test -j2 -Doptimize=ReleaseFast --summary all

test-release-small:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  # ReleaseSmall compile on the full quic test graph consistently brushes the
  # default 1h runner timeout on shared runners. Extend to 2h.
  timeout: 2h
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache: *quic-zig-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    - zig build test -j2 -Doptimize=ReleaseSmall --summary all

e2e-test-python:
  stage: e2e
  image: python:3.15-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "e2e-python-pip"
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl python3
    # Install pinned Python deps for aioquic test client
    - pip install -r test-clients/aioquic-client/requirements.txt
    # Generate test certificates
    - *generate-test-certs
  script:
    - python3 scripts/test_interop_certs.py
    - QUIC_TRUST_CLIENT=aioquic python3 test-clients/test_client_trust.py
    - python3 scripts/ci_interop.py --name python -- python -u test-clients/aioquic-client/test_client.py --host 127.0.0.1 --port 4433 --ca-file .interop-certs/ca.pem
  artifacts:
    when: always
    paths:
      - test-results/interop/
    expire_in: 7 days

e2e-test-go:
  stage: e2e
  image: golang:1.27.3
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    GOTOOLCHAIN: "auto"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go/build"
  cache:
    key: "e2e-go-cache"
    paths:
      - .cache/go/pkg/mod
      - .cache/go/build
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl python3
    # Build Go client (GOTOOLCHAIN=auto allows downloading newer Go if needed)
    - cd test-clients/quic-go-client && go build -o quic-go-test-client . && cd ../..
    # Generate test certificates
    - *generate-test-certs
  script:
    - python3 scripts/ci_interop.py --name go -- ./test-clients/quic-go-client/quic-go-test-client -addr 127.0.0.1:4433 -verbose -ca-file .interop-certs/ca.pem
  artifacts:
    when: always
    paths:
      - test-results/interop/
    expire_in: 7 days
  # Pre-existing TLS-engine HelloRetryRequest interop bug with quic-go and
  # mvfst clients. Documented in docs/PERF_GAP_ANALYSIS.md and the commit
  # message of 811420e (perf: tune PacketBufferPool slot count and document
  # pre-existing interop regression). Tracked as a separate finding for
  # future TLS-engine work; allow_failure keeps the rest of the pipeline
  # informative until that lands.
  allow_failure: true

# Trust regressions are required independently of the existing advisory
# Go-vs-Zig HelloRetryRequest interoperability check.
client-trust-go:
  extends: e2e-test-go
  needs: []
  before_script: []
  script:
    - cd test-clients/quic-go-client && go test -vet=off -race -count=1 -timeout=2m .
  artifacts: null
  allow_failure: false

e2e-test-rust:
  stage: e2e
  image: rust:1.99
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/test-clients/quinn-client/target"
  cache:
    key:
      files:
        - test-clients/quinn-client/Cargo.lock
    paths:
      - .cache/cargo/registry/index
      - .cache/cargo/registry/cache
      - .cache/cargo/git/db
      - test-clients/quinn-client/target
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl python3 python3-venv
    - python3 -m venv .client-trust-venv
    - .client-trust-venv/bin/pip install -r test-clients/aioquic-client/requirements.txt
    # Build Rust client
    - (cd test-clients/quinn-client && cargo build --locked --release)
    # Generate test certificates
    - *generate-test-certs
  script:
    - QUIC_TRUST_CLIENT=quinn .client-trust-venv/bin/python test-clients/test_client_trust.py
    - RUST_LOG=info python3 scripts/ci_interop.py --name rust -- ./test-clients/quinn-client/target/release/quinn-test-client --addr 127.0.0.1:4433 --server-name localhost --ca-file .interop-certs/ca.pem
  artifacts:
    when: always
    paths:
      - test-results/interop/
    expire_in: 7 days

e2e-test-zig:
  stage: e2e
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl python3
    # Generate test certificates
    - *generate-test-certs
  script:
    - "python3 scripts/ci_interop.py --name zig --success-marker 'echo: sonny-ci-interop' -- ./zig-out/bin/quic-client --connect 127.0.0.1:4433 --sni localhost --alpn hq-interop --insecure --msg sonny-ci-interop"
  artifacts:
    when: always
    paths:
      - test-results/interop/
    expire_in: 7 days

# QUIC interoperability testing against other implementations
# Uses GitLab shared runners which support Docker-in-Docker
interop-test:
  stage: test
  image: docker:29
  services:
    - docker:29-dind
  tags:
    - company
    - linux
    - x86
    - dedicated
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    COMPOSE_PROJECT_NAME: "interop_ci_${CI_JOB_ID}"
  before_script:
    - apk add --no-cache bash git curl
    - mkdir -p "$HOME/.docker/cli-plugins"
    - DOCKER_COMPOSE_VERSION="v5.5.1"
    - DOCKER_COMPOSE_SHA256="db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576"
    - curl -fsSL "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64" -o "$HOME/.docker/cli-plugins/docker-compose"
    - echo "${DOCKER_COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
    - chmod +x "$HOME/.docker/cli-plugins/docker-compose"
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is ready!"
          docker info
          break
        fi
        if [ $i -eq 30 ]; then
          echo "Docker daemon failed to start after 60 seconds"
          exit 1
        fi
        echo "Waiting... ($i/30)"
        sleep 2
      done
    - QUIC_INTEROP_RUNNER_COMMIT="93303cc97699d0b71651265b066fedbf6a84d4ec"
    - git init examples/interop/quic-interop-runner
    - git -C examples/interop/quic-interop-runner remote add origin https://github.com/quic-interop/quic-interop-runner.git
    - git -C examples/interop/quic-interop-runner fetch --depth 1 origin "${QUIC_INTEROP_RUNNER_COMMIT}"
    - git -C examples/interop/quic-interop-runner checkout --detach FETCH_HEAD
    - test "$(git -C examples/interop/quic-interop-runner rev-parse HEAD)" = "${QUIC_INTEROP_RUNNER_COMMIT}"
    - mkdir -p examples/interop/quic-network-simulator/logs/sim
    - mkdir -p examples/interop/quic-network-simulator/logs/server
    - mkdir -p examples/interop/quic-network-simulator/logs/client
    - mkdir -p examples/interop/quic-network-simulator/www
    - mkdir -p examples/interop/quic-network-simulator/downloads
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/index.html bs=1024 count=1 2>/dev/null
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/5000 bs=5000 count=1 2>/dev/null
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/10000 bs=10000 count=1 2>/dev/null
  script:
    - docker build -f examples/interop/zig-qns/Dockerfile -t zig-qns:local .
    - test "$(docker run --rm -e INTEROP_PRIVILEGE_CHECK=1 zig-qns:local)" = "quic"
    - export QUIC_GO_IMAGE="martenseemann/quic-go-interop@sha256:aa7949c0a4a036390aac69227264b48f114c3467776cb047ba5c1cde671e021b"
    - export QNS_IMAGE="martenseemann/quic-network-simulator@sha256:c23d82a55caffe681b1bdae65d4d30d23e1283141a414a7f02ee56cf15f9c6b9"
    - docker pull "${QUIC_GO_IMAGE}"
    - docker pull "${QNS_IMAGE}"
    - |
      COMPOSE_FILE="examples/interop/docker-compose.full.yml"

      compose() {
        docker compose -f "${COMPOSE_FILE}" --profile generic "$@"
      }

      wait_for_sim() {
        i=1
        while [ "${i}" -le 30 ]; do
          if compose ps --status running --services sim | grep -q '^sim$'; then
            return 0
          fi
          echo "Waiting for simulator readiness (${i}/30)..."
          sleep 1
          i=$((i + 1))
        done
        echo "Simulator failed to become ready within 30s" >&2
        return 1
      }

      run_case() {
        title="$1"
        server_image="$2"
        client_image="$3"
        testcase="$4"

        echo "=== Test: ${title} ==="
        compose rm -fsv server client >/dev/null 2>&1 || true
        export SERVER_IMAGE="${server_image}"
        export CLIENT_IMAGE="${client_image}"
        export TESTCASE="${testcase}"
        timeout 120 docker compose -f "${COMPOSE_FILE}" --profile generic up --abort-on-container-exit --timeout 30 server client || true
      }

      cleanup() {
        compose down -v >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      compose up -d sim
      wait_for_sim

      run_case "Zig server <-> quic-go client (handshake)" "zig-qns:local" "${QUIC_GO_IMAGE}" "handshake"
      run_case "quic-go server <-> Zig client (handshake)" "${QUIC_GO_IMAGE}" "zig-qns:local" "handshake"
      run_case "Zig server <-> quic-go client (transfer)" "zig-qns:local" "${QUIC_GO_IMAGE}" "transfer"
      run_case "quic-go server <-> Zig client (transfer)" "${QUIC_GO_IMAGE}" "zig-qns:local" "transfer"
    - echo "Interop tests completed"
  artifacts:
    when: always
    paths:
      - examples/interop/quic-network-simulator/logs/
    expire_in: 7 days
  allow_failure: true

quality-zig-gates:
  stage: test
  image: debian:bookworm-slim
  variables:
    # Full history so the paired-commit perf gate can check out the
    # comparison commit (MR diff base / previous main commit).
    GIT_DEPTH: "0"
    # 5 paired baseline/HEAD rounds in alternating order (see
    # scripts/perf-gate.sh). A row fails only if its regression reproduces:
    # every HEAD round is worse than every baseline round and the median
    # change exceeds the threshold, and micro rows must also move by more
    # than the absolute floors (p95 3 ns, per-op 1 ns)
    # (benchmarks/compare.zig, docs/PERFORMANCE_TARGETS.md#noise-tolerance).
    # Failing on any single round tripped on noise on nearly every run since
    # June (e.g. 2936039032, 2936132303, 2937011195, 2938467287), each
    # time on different rows.
    # 5, not 3: the micro suite tests ~70 row/metric pairs per run, and with
    # 3 rounds per side each has a 1/20 chance of non-overlapping ranges on
    # identical code. After the floors and thresholds that still left a
    # false FAIL in about half the runs (main schedule 2948905825:
    # frame_serialization/ack and reset_stream on unchanged bench sources;
    # MRs !76 and !80 on connection_lookup/1000 and aead/chacha20). With 5
    # rounds the chance is 1/252 per pair (about 0.3 per run before the
    # thresholds apply), for roughly 6 extra minutes.
    PERF_GATE_ROUNDS: "5"
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache: *quic-zig-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git libssl-dev
    # The checkout may belong to the runner helper UID. Trust only this exact
    # checkout in the disposable job container, never a wildcard or runner host.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - *install-zig
  script:
    - zig build examples
    # Capture the actual baseline and candidate sequentially on this runner.
    # compare.zig retains environment checks, relative thresholds and absolute
    # gates (varint <=250ns p99, pacing <=400ns p99, hp <=400k ns p99,
    # short-header alloc_bytes==0) that the legacy scripts/perf_gate.sh
    # used to enforce inline; the batch/single ratio gate from
    # scripts/perf_udp_batch_gate.sh is absorbed as a post-compare jq
    # check in perf-gate.sh itself.
    - apt-get install -y --no-install-recommends jq
    # Keep comparator regression checks before the paired performance gate.
    - zig build test-bench-compare
    # Micro remains the CI scope; integration/all retain their dedicated jobs.
    - python3 scripts/test_ci_perf_gate.py
    - bash scripts/ci-perf-gate.sh
    - scripts/cross_platform_udp_batch_smoke.sh
  artifacts:
    when: always
    paths:
      - benchmarks/results/paired/
    expire_in: 7 days

# 20x stress follow-up for perf-accepted changes.
# Runs the integration scenarios that exercise the send-path production code
# (handshake_e2e, stream_throughput, conn_scale) 20 times each and uploads the
# per-round JSON as artifacts. Per native-benchmarks methodology, a single
# non-zero exit or a SKIP row across the 20 rounds rejects the run.
#
# NOT on every MR: this is a ~30-60 min job. Triggers:
#   - scheduled pipelines (configure in GitLab UI -> CI/CD -> Schedules)
#   - manual on MRs when a perf change is involved
#   - manual on main after a perf-affecting merge
stress-integration-20x:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  cache: *quic-zig-cache
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git libssl-dev jq
    - *install-zig
  script:
    - mkdir -p stress-results
    - zig build
    - |
      set -e
      FAILED=0
      for suite in handshake_e2e stream_throughput conn_scale; do
        echo "=== 20x stress: ${suite} ==="
        for i in $(seq -w 1 20); do
          OUT="stress-results/${suite}_round_${i}.json"
          if ! zig build bench -- --suite=${suite} --output=${OUT}; then
            echo "[stress] FAIL: ${suite} round ${i} exited non-zero"
            FAILED=$((FAILED+1))
            continue
          fi
          # Reject any SKIP row (indicates setup / toolchain failure).
          if jq -e '.rows[] | select(.variant | endswith("-SKIP"))' "${OUT}" >/dev/null; then
            echo "[stress] FAIL: ${suite} round ${i} produced SKIP row(s) -- setup failure"
            FAILED=$((FAILED+1))
          fi
        done
      done
      if [ "${FAILED}" -gt 0 ]; then
        echo "[stress] REJECT: ${FAILED} round(s) failed across 60 total (3 suites x 20 rounds)"
        exit 1
      fi
      echo "[stress] PASS: all 60 rounds completed cleanly"
  artifacts:
    when: always
    paths:
      - stress-results/
    expire_in: 30 days

runtime-smoke-macos:
  stage: test
  # Installs its own toolchain and uses no Linux build/FIPS artifacts.
  # Runs on the devnw dedicated Apple Silicon runners (shell executor, so
  # there is no image to pick; Xcode and python3 come from the host).
  needs: []
  timeout: 15m
  tags:
    - dedicated
    - macos
    - arm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/quic/**/*
        - src/fips_backend/std_shim.zig
        - tests/test_portable_runtime.zig
        - scripts/native_runtime_smoke.sh
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_COMMIT_TAG
  before_script:
    - ZIG_ARCHIVE="zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
    - |
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(python3 -c "
      import json, sys
      idx = json.load(open('${INDEX_FILE}'))
      pkg = idx.get('${ZIG_VERSION}', {}).get('aarch64-macos', {})
      h = pkg.get('shasum', '')
      if not h: sys.exit('SHA-256 not found for ${ZIG_VERSION}/aarch64-macos')
      print(h)
      ")
      rm -f "${INDEX_FILE}"
    - curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}"
    - echo "${EXPECTED_HASH}  ${ZIG_ARCHIVE}" | shasum -a 256 --check
    - tar -xf "${ZIG_ARCHIVE}"
    - export PATH="$PWD/zig-aarch64-macos-${ZIG_VERSION}:$PATH"
  script:
    - scripts/native_runtime_smoke.sh

runtime-smoke-windows-saas:
  stage: test
  tags:
    - company
    - linux
    - windows
  rules:
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_COMMIT_TAG
  script:
    - '$ErrorActionPreference = "Stop"'
    - '$zigArchive = "zig-x86_64-windows-$env:ZIG_VERSION.zip"'
    - |
      $indexFile = "$env:TEMP\zig-index.json"
      Invoke-WebRequest -Uri "https://ziglang.org/download/index.json" -OutFile $indexFile
      $index = Get-Content $indexFile | ConvertFrom-Json
      $expectedHash = $index.$env:ZIG_VERSION."x86_64-windows".shasum
      if (-not $expectedHash) { throw "SHA-256 not found for $env:ZIG_VERSION/x86_64-windows" }
      Remove-Item $indexFile
    - 'Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/$zigArchive" -OutFile $zigArchive'
    - |
      $actualHash = (Get-FileHash -Path $zigArchive -Algorithm SHA256).Hash.ToLower()
      if ($actualHash -ne $expectedHash) {
        throw "SHA-256 mismatch: expected $expectedHash, got $actualHash"
      }
      Write-Host "SHA-256 verified: $actualHash"
    - 'Expand-Archive -Path $zigArchive -DestinationPath .'
    - '$env:Path = "$pwd\zig-x86_64-windows-$env:ZIG_VERSION;$env:Path"'
    - '.\scripts\native_runtime_smoke.ps1'

