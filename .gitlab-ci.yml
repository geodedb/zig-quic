default:
  # Pin to Linux runners. Without the `linux` tag, jobs without an `image:`
  # directive (e.g. zig-format, gemnasium-dependency_scanning from included
  # components) can be picked up by the group's Hosted Windows Runner —
  # whose PowerShell shell-executor then tries to run our bash scripts and
  # fails. All Linux runners (Company Cluster, OVH Dedicated, Lab Servers)
  # carry both `company` and `linux`; the Windows runner does not.
  #
  # `x86` keeps every job on the x86_64 Linux pools (OVH Dedicated, AWS Spot).
  # The ARM lab runner also carries `company,linux`, and when `build` and its
  # consumers landed on different architectures the e2e jobs got binaries
  # they could not execute (`quic-client: Syntax error: ")" unexpected`) and
  # the perf gate compared aarch64 numbers to the x86_64 baseline
  # (`ENV MISMATCH`). Same tag devnw/zig/ldap uses.
  interruptible: true
  tags:
    - company
    - linux
    - x86

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@aad997d40e358eeef7ec943f761498341c37c724

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@aad997d40e358eeef7ec943f761498341c37c724

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@aad997d40e358eeef7ec943f761498341c37c724
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@aad997d40e358eeef7ec943f761498341c37c724

  # Release
  # job_token: create the release with CI_JOB_TOKEN. The default (glab)
  # mode needs a GITLAB_TOKEN with api scope; the project's token lacks it,
  # so create-release failed with 403 insufficient_scope on v0.1.45
  # (pipeline 2960599429) and no tag since v0.1.11 got a GitLab release.
  - component: gitlab.com/devnw/ci-catalog/release-semantic@aad997d40e358eeef7ec943f761498341c37c724
    inputs:
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@aad997d40e358eeef7ec943f761498341c37c724

stages:
  - lint
  - build
  - test
  - e2e
  - fuzz
  - security
  - sbom
  - release
  - maintenance

variables:
  ZIG_VERSION: "0.16.0"

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# GitLab Advanced SAST: download no artifacts. With no `needs`, these
# test-stage jobs pulled every earlier artifact, including the
# security-policy jobs' own gl-sast-report.json (gitlab-advanced-sast-profile-0
# and -ext-profile-0). The analyzer runs as a non-root user and then failed
# with "open .../gl-sast-report.json: permission denied" whenever the
# root-owned copy landed last (pipelines 2933883902, 2936039032).
# It also wasted scan time on .openssl-fips/ and zig-out/ binaries. The
# analyzer only needs the checked-out source.

# zig-format component override: inject Zig install before format check
zig-format:
  before_script:
    - *install-zig

# E2E tests with multiple QUIC client implementations
# Tests Python (aioquic), Go (quic-go), Rust (quinn), and Zig clients
# Generate test certificates for E2E tests
# GitLab only uploads artifacts from inside $CI_PROJECT_DIR, so the e2e jobs'
# /tmp/{server,client}.log were never kept ("artifact path is not a subpath of
# project directory"). Copy them into the project dir and print the tail of
# the server log so a server crash is diagnosable from the job trace.
.collect-e2e-logs: &collect-e2e-logs
  - mkdir -p "$CI_PROJECT_DIR/e2e-logs"
  - cp /tmp/server.log /tmp/client.log "$CI_PROJECT_DIR/e2e-logs/" 2>/dev/null || true
  - echo "--- tail of server.log ---"; tail -n 100 "$CI_PROJECT_DIR/e2e-logs/server.log" 2>/dev/null || true

.generate-test-certs: &generate-test-certs
  - |
    openssl ecparam -genkey -name prime256v1 -out server-key.pem
    openssl req -new -x509 -key server-key.pem -out server-cert.pem -days 1 \
      -subj "/CN=localhost/O=Test/C=US" \
      -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

build:
  stage: build
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    # Portable CPU baseline: the e2e and interop jobs run these binaries on
    # whichever x86_64 runner picks them up. A native build on a host with
    # SHA-NI emitted sha256rnds2, and e2e-test-go's quic-server then died
    # with "Illegal instruction" in std/crypto/sha2.zig on a runner without
    # it (pipelines 2935996196, 2936132303). x86_64_v2 runs on every x86 pool.
    - zig build -Dcpu=x86_64_v2
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

test:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    - zig build test --summary all

# FIPS-140-3 dual-mode gate (-Dfips=true), same pattern as devnw/zig/fts-storage.
#
# `fips-deps` builds the latest OpenSSL 3.x + FIPS provider via the repo
# `make deps` target (scripts/install-openssl-fips.sh, a byte-identical copy
# of devnw/zig/fips' script). GitLab artifacts must live under
# $CI_PROJECT_DIR, so the provider goes to a project-relative prefix
# (.openssl-fips/) that test-fips receives as an artifact. The previous inline
# job ran `../fips/scripts/install-openssl-fips.sh || true`, a path that does
# not exist in CI, so test-fips then failed to find libssl/libcrypto.
#
# OPENSSL_VERSION pinned: the script's "latest 3.x" resolver greps
# releases/latest for an openssl-3.* tag, but the latest release is now the
# 4.x line, so the grep silently falls back to the system OpenSSL. Bump this
# pin alongside OpenSSL 3.x LTS releases.
fips-deps:
  stage: build
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update
    # wget + sudo + gnupg: required by scripts/install-openssl-fips.sh (it
    # fetches/verifies OpenSSL via wget/gpg and installs via sudo; kept
    # unpatched to stay byte-identical with upstream, and sudo as root in the
    # container is a no-op wrapper).
    - apt-get install -y --no-install-recommends build-essential perl wget curl sudo gnupg ca-certificates make
  script:
    - OPENSSL_PREFIX="$CI_PROJECT_DIR/.openssl-fips" OPENSSL_VERSION="3.6.3" make deps
  artifacts:
    paths:
      - .openssl-fips/
    expire_in: 1 day

test-fips:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: fips-deps
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - *install-zig
    # fips-deps bakes its own $CI_PROJECT_DIR into openssl.cnf's `.include`
    # and the compiled-in module dir. Runners with per-concurrency build dirs
    # can give this job a different $CI_PROJECT_DIR, so re-point the include
    # and the provider/library search paths at where the artifact landed.
    - FIPS_PREFIX="$CI_PROJECT_DIR/.openssl-fips"
    - sed -i "s#^\.include .*/ssl/fipsmodule\.cnf\$#.include ${FIPS_PREFIX}/ssl/fipsmodule.cnf#" "$FIPS_PREFIX/ssl/openssl.cnf"
    - grep -q "^\.include ${FIPS_PREFIX}/ssl/fipsmodule\.cnf\$" "$FIPS_PREFIX/ssl/openssl.cnf"
    - FIPS_LIBDIR="$FIPS_PREFIX/lib64"; [ -d "$FIPS_LIBDIR/ossl-modules" ] || FIPS_LIBDIR="$FIPS_PREFIX/lib"
    - export OPENSSL_MODULES="$FIPS_LIBDIR/ossl-modules" LD_LIBRARY_PATH="$FIPS_LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
  script:
    - OPENSSL_CONF="$CI_PROJECT_DIR/.openssl-fips/ssl/openssl.cnf" zig build test -Dfips=true -Dopenssl_path="$CI_PROJECT_DIR/.openssl-fips" --summary all

