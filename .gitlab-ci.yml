e2e-test-python:
  stage: e2e
  image: python:3.14-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "e2e-python-pip"
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl
    # Install pinned Python deps for aioquic test client
    - pip install -r test-clients/aioquic-client/requirements.txt
    # Generate test certificates
    - *generate-test-certs
  script:
    # Server binary already built by build job
    - ls -la zig-out/bin/
    # Start server
    - ./zig-out/bin/quic-server --bind 127.0.0.1:4433 --cert server-cert.pem --key server-key.pem --insecure > /tmp/server.log 2>&1 &
    - SERVER_PID=$!
    - sleep 3
    # Run Python client
    - cd test-clients/aioquic-client
    - python test_client.py --host 127.0.0.1 --port 4433 --insecure 2>&1 | tee /tmp/client.log
    - kill $SERVER_PID 2>/dev/null || true
    # Check for success
    - grep -q "Test completed successfully" /tmp/client.log
  after_script: *collect-e2e-logs
  artifacts:
    when: always
    paths:
      - e2e-logs/
    expire_in: 7 days

e2e-test-go:
  stage: e2e
  image: golang:1.27.3
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    GOTOOLCHAIN: "auto"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go/build"
  cache:
    key: "e2e-go-cache"
    paths:
      - .cache/go/pkg/mod
      - .cache/go/build
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl
    # Build Go client (GOTOOLCHAIN=auto allows downloading newer Go if needed)
    - cd test-clients/quic-go-client && go build -o quic-go-test-client . && cd ../..
    # Generate test certificates
    - *generate-test-certs
  script:
    # Server binary already built by build job
    - ls -la zig-out/bin/
    # Start server
    - ./zig-out/bin/quic-server --bind 127.0.0.1:4433 --cert server-cert.pem --key server-key.pem --insecure > /tmp/server.log 2>&1 &
    - SERVER_PID=$!
    - sleep 3
    # Run Go client
    - cd test-clients/quic-go-client
    - ./quic-go-test-client -addr 127.0.0.1:4433 -verbose -insecure 2>&1 | tee /tmp/client.log
    - kill $SERVER_PID 2>/dev/null || true
    # Check for success
    - grep -q "Test completed successfully" /tmp/client.log
  after_script: *collect-e2e-logs
  artifacts:
    when: always
    paths:
      - e2e-logs/
    expire_in: 7 days
  # Pre-existing TLS-engine HelloRetryRequest interop bug with quic-go and
  # mvfst clients. Documented in docs/PERF_GAP_ANALYSIS.md and the commit
  # message of 811420e (perf: tune PacketBufferPool slot count and document
  # pre-existing interop regression). Tracked as a separate finding for
  # future TLS-engine work; allow_failure keeps the rest of the pipeline
  # informative until that lands.
  allow_failure: true

e2e-test-rust:
  stage: e2e
  image: rust:1.99
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
    CARGO_TARGET_DIR: "$CI_PROJECT_DIR/test-clients/quinn-client/target"
  cache:
    key:
      files:
        - test-clients/quinn-client/Cargo.lock
    paths:
      - .cache/cargo/registry/index
      - .cache/cargo/registry/cache
      - .cache/cargo/git/db
      - test-clients/quinn-client/target
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl
    # Build Rust client
    - cd test-clients/quinn-client && cargo build --release && cd ../..
    # Generate test certificates
    - *generate-test-certs
  script:
    # Server binary already built by build job
    - ls -la zig-out/bin/
    # Start server
    - ./zig-out/bin/quic-server --bind 127.0.0.1:4433 --cert server-cert.pem --key server-key.pem --insecure > /tmp/server.log 2>&1 &
    - SERVER_PID=$!
    - sleep 3
    # Run Rust client
    - cd test-clients/quinn-client
    - RUST_LOG=info ./target/release/quinn-test-client --addr 127.0.0.1:4433 --server-name localhost 2>&1 | tee /tmp/client.log
    - kill $SERVER_PID 2>/dev/null || true
    # Check for success
    - grep -q "Test completed successfully" /tmp/client.log
  after_script: *collect-e2e-logs
  artifacts:
    when: always
    paths:
      - e2e-logs/
    expire_in: 7 days

e2e-test-zig:
  stage: e2e
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl
    # Generate test certificates
    - *generate-test-certs
  script:
    # Server and client binaries already built by build job
    - ls -la zig-out/bin/
    # Start server
    - ./zig-out/bin/quic-server --bind 127.0.0.1:4433 --cert server-cert.pem --key server-key.pem --insecure > /tmp/server.log 2>&1 &
    - SERVER_PID=$!
    - sleep 3
    # Run Zig client
    - timeout 30 ./zig-out/bin/quic-client --addr 127.0.0.1:4433 --insecure 2>&1 | tee /tmp/client.log || true
    - kill $SERVER_PID 2>/dev/null || true
    # Check server accepted connection
    - grep -q "accepted connection" /tmp/server.log || grep -q "active connections" /tmp/server.log
  after_script: *collect-e2e-logs
  artifacts:
    when: always
    paths:
      - e2e-logs/
    expire_in: 7 days

# QUIC interoperability testing against other implementations
# Uses GitLab shared runners which support Docker-in-Docker
interop-test:
  stage: test
  image: docker:29
  services:
    - docker:29-dind
  tags:
    - company
    - linux
    - x86
    - dedicated
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    COMPOSE_PROJECT_NAME: "interop_ci_${CI_JOB_ID}"
  before_script:
    - apk add --no-cache bash git curl
    - mkdir -p "$HOME/.docker/cli-plugins"
    - DOCKER_COMPOSE_VERSION="v5.5.1"
    - DOCKER_COMPOSE_SHA256="db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576"
    - curl -fsSL "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64" -o "$HOME/.docker/cli-plugins/docker-compose"
    - echo "${DOCKER_COMPOSE_SHA256}  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
    - chmod +x "$HOME/.docker/cli-plugins/docker-compose"
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is ready!"
          docker info
          break
        fi
        if [ $i -eq 30 ]; then
          echo "Docker daemon failed to start after 60 seconds"
          exit 1
        fi
        echo "Waiting... ($i/30)"
        sleep 2
      done
    - QUIC_INTEROP_RUNNER_COMMIT="93303cc97699d0b71651265b066fedbf6a84d4ec"
    - git init examples/interop/quic-interop-runner
    - git -C examples/interop/quic-interop-runner remote add origin https://github.com/quic-interop/quic-interop-runner.git
    - git -C examples/interop/quic-interop-runner fetch --depth 1 origin "${QUIC_INTEROP_RUNNER_COMMIT}"
    - git -C examples/interop/quic-interop-runner checkout --detach FETCH_HEAD
    - test "$(git -C examples/interop/quic-interop-runner rev-parse HEAD)" = "${QUIC_INTEROP_RUNNER_COMMIT}"
    - mkdir -p examples/interop/quic-network-simulator/logs/sim
    - mkdir -p examples/interop/quic-network-simulator/logs/server
    - mkdir -p examples/interop/quic-network-simulator/logs/client
    - mkdir -p examples/interop/quic-network-simulator/www
    - mkdir -p examples/interop/quic-network-simulator/downloads
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/index.html bs=1024 count=1 2>/dev/null
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/5000 bs=5000 count=1 2>/dev/null
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/10000 bs=10000 count=1 2>/dev/null
  script:
    - docker build -f examples/interop/zig-qns/Dockerfile -t zig-qns:local .
    - test "$(docker run --rm -e INTEROP_PRIVILEGE_CHECK=1 zig-qns:local)" = "quic"
    - export QUIC_GO_IMAGE="martenseemann/quic-go-interop@sha256:aa7949c0a4a036390aac69227264b48f114c3467776cb047ba5c1cde671e021b"
    - export QNS_IMAGE="martenseemann/quic-network-simulator@sha256:c23d82a55caffe681b1bdae65d4d30d23e1283141a414a7f02ee56cf15f9c6b9"
    - docker pull "${QUIC_GO_IMAGE}"
    - docker pull "${QNS_IMAGE}"
    - |
      COMPOSE_FILE="examples/interop/docker-compose.full.yml"

      compose() {
        docker compose -f "${COMPOSE_FILE}" --profile generic "$@"
      }

      wait_for_sim() {
        i=1
        while [ "${i}" -le 30 ]; do
          if compose ps --status running --services sim | grep -q '^sim$'; then
            return 0
          fi
          echo "Waiting for simulator readiness (${i}/30)..."
          sleep 1
          i=$((i + 1))
        done
        echo "Simulator failed to become ready within 30s" >&2
        return 1
      }

      run_case() {
        title="$1"
        server_image="$2"
        client_image="$3"
        testcase="$4"

        echo "=== Test: ${title} ==="
        compose rm -fsv server client >/dev/null 2>&1 || true
        export SERVER_IMAGE="${server_image}"
        export CLIENT_IMAGE="${client_image}"
        export TESTCASE="${testcase}"
        timeout 120 docker compose -f "${COMPOSE_FILE}" --profile generic up --abort-on-container-exit --timeout 30 server client || true
      }

      cleanup() {
        compose down -v >/dev/null 2>&1 || true
      }
      trap cleanup EXIT

      compose up -d sim
      wait_for_sim

      run_case "Zig server <-> quic-go client (handshake)" "zig-qns:local" "${QUIC_GO_IMAGE}" "handshake"
      run_case "quic-go server <-> Zig client (handshake)" "${QUIC_GO_IMAGE}" "zig-qns:local" "handshake"
      run_case "Zig server <-> quic-go client (transfer)" "zig-qns:local" "${QUIC_GO_IMAGE}" "transfer"
      run_case "quic-go server <-> Zig client (transfer)" "${QUIC_GO_IMAGE}" "zig-qns:local" "transfer"
    - echo "Interop tests completed"
  artifacts:
    when: always
    paths:
      - examples/interop/quic-network-simulator/logs/
    expire_in: 7 days
  allow_failure: true

quality-zig-gates:
  stage: test
  image: debian:bookworm-slim
  variables:
    # Full history so the paired-commit perf gate can check out the
    # comparison commit (MR diff base / previous main commit).
    GIT_DEPTH: "0"
    # 5 paired baseline/HEAD rounds in alternating order (see
    # scripts/perf-gate.sh). A row fails only if its regression reproduces:
    # every HEAD round is worse than every baseline round and the median
    # change exceeds the threshold, and micro rows must also move by more
    # than the absolute floors (p95 3 ns, per-op 1 ns)
    # (benchmarks/compare.zig, docs/PERFORMANCE_TARGETS.md#noise-tolerance).
    # Failing on any single round tripped on noise on nearly every run since
    # June (e.g. 2936039032, 2936132303, 2937011195, 2938467287), each
    # time on different rows.
    # 5, not 3: the micro suite tests ~70 row/metric pairs per run, and with
    # 3 rounds per side each has a 1/20 chance of non-overlapping ranges on
    # identical code. After the floors and thresholds that still left a
    # false FAIL in about half the runs (main schedule 2948905825:
    # frame_serialization/ack and reset_stream on unchanged bench sources;
    # MRs !76 and !80 on connection_lookup/1000 and aead/chacha20). With 5
    # rounds the chance is 1/252 per pair (about 0.3 per run before the
    # thresholds apply), for roughly 6 extra minutes.
    PERF_GATE_ROUNDS: "5"
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git libssl-dev
    - *install-zig
  script:
    - git ls-files '*.zig' | xargs -r zig fmt --check
    - zig build examples
    # Unified tiered perf gate (Phase 7 Task 7.1). Runs `zig build bench`
    # to capture current-HEAD JSON, then `zig build bench-compare` against
    # benchmarks/results/baseline.json. compare.zig enforces the absolute
    # gates (varint <=250ns p99, pacing <=400ns p99, hp <=400k ns p99,
    # short-header alloc_bytes==0) that the legacy scripts/perf_gate.sh
    # used to enforce inline; the batch/single ratio gate from
    # scripts/perf_udp_batch_gate.sh is absorbed as a post-compare jq
    # check in perf-gate.sh itself.
    - apt-get install -y --no-install-recommends jq
    # Self-test of the comparator's noise rules against recorded CI noise
    # and injected regressions (tests/test_bench_compare.zig).
    - zig build test-bench-compare
    # Paired-commit mode: bench the comparison commit and HEAD back to back
    # on the same runner, then compare. The committed
    # benchmarks/results/baseline.json was captured on a developer
    # workstation (host "hurin"); every CI runner measures 2-5x slower than
    # it, so comparing CI numbers against that file failed on every main and
    # tag pipeline since it landed (e.g. 33 FAIL on 2924575430) without
    # detecting a regression. Same thresholds and absolute gates
    # (benchmarks/compare.zig); only the reference point is now same-host.
    # Using --suite=micro keeps this job short; integration/all are owned by
    # `zig build bench-integration` / dedicated stress jobs.
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        PERF_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      elif [ -n "${CI_COMMIT_BEFORE_SHA:-}" ] && [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
        PERF_BASE="$CI_COMMIT_BEFORE_SHA"
      else
        PERF_BASE="$(git rev-parse HEAD~1)"
      fi
      echo "perf gate comparison commit: $PERF_BASE"
      scripts/perf-gate.sh --baseline-commit="$PERF_BASE" --suite=micro
    - scripts/cross_platform_udp_batch_smoke.sh

# 20x stress follow-up for perf-accepted changes.
# Runs the integration scenarios that exercise the send-path production code
# (handshake_e2e, stream_throughput, conn_scale) 20 times each and uploads the
# per-round JSON as artifacts. Per native-benchmarks methodology, a single
# non-zero exit or a SKIP row across the 20 rounds rejects the run.
#
# NOT on every MR: this is a ~30-60 min job. Triggers:
#   - scheduled pipelines (configure in GitLab UI -> CI/CD -> Schedules)
#   - manual on MRs when a perf change is involved
#   - manual on main after a perf-affecting merge
stress-integration-20x:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git libssl-dev jq
    - *install-zig
  script:
    - mkdir -p stress-results
    - zig build
    - |
      set -e
      FAILED=0
      for suite in handshake_e2e stream_throughput conn_scale; do
        echo "=== 20x stress: ${suite} ==="
        for i in $(seq -w 1 20); do
          OUT="stress-results/${suite}_round_${i}.json"
          if ! zig build bench -- --suite=${suite} --output=${OUT}; then
            echo "[stress] FAIL: ${suite} round ${i} exited non-zero"
            FAILED=$((FAILED+1))
            continue
          fi
          # Reject any SKIP row (indicates setup / toolchain failure).
          if jq -e '.rows[] | select(.variant | endswith("-SKIP"))' "${OUT}" >/dev/null; then
            echo "[stress] FAIL: ${suite} round ${i} produced SKIP row(s) -- setup failure"
            FAILED=$((FAILED+1))
          fi
        done
      done
      if [ "${FAILED}" -gt 0 ]; then
        echo "[stress] REJECT: ${FAILED} round(s) failed across 60 total (3 suites x 20 rounds)"
        exit 1
      fi
      echo "[stress] PASS: all 60 rounds completed cleanly"
  artifacts:
    when: always
    paths:
      - stress-results/
    expire_in: 30 days

runtime-smoke-macos-saas:
  stage: test
  image: macos-15-xcode-16
  tags:
    - saas-macos-medium-m1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/quic/**/*
        - src/fips_backend/std_shim.zig
        - tests/test_portable_runtime.zig
        - scripts/native_runtime_smoke.sh
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_COMMIT_TAG
  before_script:
    - ZIG_ARCHIVE="zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
    - |
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(python3 -c "
      import json, sys
      idx = json.load(open('${INDEX_FILE}'))
      pkg = idx.get('${ZIG_VERSION}', {}).get('aarch64-macos', {})
      h = pkg.get('shasum', '')
      if not h: sys.exit('SHA-256 not found for ${ZIG_VERSION}/aarch64-macos')
      print(h)
      ")
      rm -f "${INDEX_FILE}"
    - curl -fsSLO "https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}"
    - echo "${EXPECTED_HASH}  ${ZIG_ARCHIVE}" | shasum -a 256 --check
    - tar -xf "${ZIG_ARCHIVE}"
    - export PATH="$PWD/zig-aarch64-macos-${ZIG_VERSION}:$PATH"
  script:
    - scripts/native_runtime_smoke.sh

runtime-smoke-windows-saas:
  stage: test
  tags:
    - company
    - linux
    - windows
  rules:
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $ENABLE_NATIVE_RUNTIME_SMOKE == "true" && $CI_COMMIT_TAG
  script:
    - '$ErrorActionPreference = "Stop"'
    - '$zigArchive = "zig-x86_64-windows-$env:ZIG_VERSION.zip"'
    - |
      $indexFile = "$env:TEMP\zig-index.json"
      Invoke-WebRequest -Uri "https://ziglang.org/download/index.json" -OutFile $indexFile
      $index = Get-Content $indexFile | ConvertFrom-Json
      $expectedHash = $index.$env:ZIG_VERSION."x86_64-windows".shasum
      if (-not $expectedHash) { throw "SHA-256 not found for $env:ZIG_VERSION/x86_64-windows" }
      Remove-Item $indexFile
    - 'Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/$zigArchive" -OutFile $zigArchive'
    - |
      $actualHash = (Get-FileHash -Path $zigArchive -Algorithm SHA256).Hash.ToLower()
      if ($actualHash -ne $expectedHash) {
        throw "SHA-256 mismatch: expected $expectedHash, got $actualHash"
      }
      Write-Host "SHA-256 verified: $actualHash"
    - 'Expand-Archive -Path $zigArchive -DestinationPath .'
    - '$env:Path = "$pwd\zig-x86_64-windows-$env:ZIG_VERSION;$env:Path"'
    - '.\scripts\native_runtime_smoke.ps1'

