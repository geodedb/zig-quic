  script:
    - python3 scripts/test_perf_rounds.py
    - python3 scripts/test_hook_env.py
  allow_failure: false

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_COMMIT_TAG'
      auto_cancel:
        on_new_commit: none
    - when: always
