# Prefer the MR pipeline for feature branches with open MRs. Preserve
# default-branch/tag releases and scheduled, API, and triggered pipelines.
workflow:
  auto_cancel:
    on_job_failure: all
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - when: always

# Catalog jobs without rules default to except:merge_requests. These gates
# must also run in the MR pipeline that determines merge eligibility.
.component-verification:
  rules: &component-verification-rules
    - when: on_success

default:
  # Pin to Linux runners. Without the `linux` tag, jobs without an `image:`
  # directive (e.g. zig-format, gemnasium-dependency_scanning from included
  # components) can be picked up by the group's Hosted Windows Runner —
  # whose PowerShell shell-executor then tries to run our bash scripts and
  # fails. All Linux runners (Company Cluster, OVH Dedicated, Lab Servers)
  # carry both `company` and `linux`; the Windows runner does not.
  tags:
    - company
    - linux

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.2.1

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.27.0

stages:
  - lint
  - build
  - test
  - e2e
  - fuzz
  - security
  - sbom
  - release
  - maintenance

variables:
  ZIG_VERSION: "0.16.0"

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    # Keep the verified toolchain outside the source tree so paired benchmark
    # provenance can require a clean checkout without ignoring runtime inputs.
    QUIC_CI_CHECKOUT_DIR=$PWD
    QUIC_CI_TOOLCHAIN_DIR=$(mktemp -d "${TMPDIR:-/tmp}/quic-zig.XXXXXXXX")
    export QUIC_CI_TOOLCHAIN_DIR
    cd "${QUIC_CI_TOOLCHAIN_DIR}"
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
    cd "${QUIC_CI_CHECKOUT_DIR}"
  - export PATH="${QUIC_CI_TOOLCHAIN_DIR}/zig-${ZIG_VERSION}:$PATH"
  - zig version
  - |
    python3 - <<'PY'
    import json, os
    from pathlib import Path
    resources = {"cpu_affinity": sorted(os.sched_getaffinity(0))}
    for name in ("cpu.max", "memory.max", "cpuset.cpus.effective"):
        path = Path("/sys/fs/cgroup") / name
        if path.exists():
            resources[name] = path.read_text().strip()
    print("CI resources: " + json.dumps(resources))
    PY

# zig-format component override: inject Zig install before format check
zig-format:
  rules: *component-verification-rules
  before_script:
    - *install-zig

# Opt both SBOM jobs in together to preserve the scan's artifact dependency.
security-gitleaks:
  rules: *component-verification-rules
  # Use the required scanner's own image to verify the narrow public-key
  # exception and negative controls before scanning repository history.
  before_script:
    - sh scripts/test_gitleaks_allowlist.sh

sbom-generate:
  rules: *component-verification-rules

sbom-scan:
  rules: *component-verification-rules

# E2E tests with multiple QUIC client implementations
# Tests Python (aioquic), Go (quic-go), Rust (quinn), and Zig clients
# Required live unit regressions use generated P-256 credentials.
.generate-unit-test-certs: &generate-unit-test-certs
  - bash scripts/generate_interop_certs.sh tests/certs

# Generate test certificates for E2E tests
.generate-test-certs: &generate-test-certs
  - bash scripts/generate_interop_certs.sh .interop-certs
  - cp .interop-certs/cert.pem server-cert.pem
  - cp .interop-certs/key.pem server-key.pem

build:
  stage: build
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    - python3 scripts/test_ci_interop.py -v
    - python3 scripts/test_client_security.py -v
    # Shared executables run on other x86 runners; native CPU features are unsafe.
    - zig build -Dtarget=x86_64-linux-gnu -Dcpu=baseline
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

test:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev openssl
    - *install-zig
    - *generate-unit-test-certs
  script:
    # Build/test subprocess concurrency must fit a small container CPU quota;
    # the 32-client regression and every workload deadline stay unchanged.
    - zig build test -j2 --summary all

# FIPS-140-3 dual-mode gate. Builds the OpenSSL 3.x FIPS provider into
# /usr/local/ssl (the same script the `fips` package ships), then runs the
# QUIC test suite with -Dfips=true so the AES-GCM-forced / ChaCha-rejected
# crypto path is exercised under the linked FIPS provider.
#
# The explicit provisioning step uses the manifest's hash-pinned dependency,
# verifies the OpenSSL release signature, and fails if setup/provider checks fail.
test-fips:
  stage: test
  image: debian:bookworm-slim
  variables:
    # Explicit 3.x pin: GitHub's latest release may be 4.x. The installer must
    # not fall back to the runner's older system library, which lacks PQC.
    OPENSSL_VERSION: "3.6.5"
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends build-essential perl wget ca-certificates git sudo gnupg dirmngr python3 openssl
    - *install-zig
    - python3 scripts/test_fips_provision.py
    # OpenSSL identifies this bundle as authoritative when key servers differ:
    # https://www.openssl-library.org/source/#downloads
    # The pinned installer still checks signatures against pinned fingerprints.
    - wget -q https://www.openssl-library.org/source/pubkeys.asc -O /tmp/openssl-pubkeys.asc
    - gpg --batch --import /tmp/openssl-pubkeys.asc
    - zig build provision-fips -Dfips=true -Dopenssl_path=/usr/local/ssl --summary all
    - *generate-unit-test-certs
  script:
    - OPENSSL_CONF=/usr/local/ssl/ssl/openssl.cnf zig build test -j2 -Dfips=true -Dopenssl_path=/usr/local/ssl --summary all

test-release-safe:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev openssl
    - *install-zig
    - *generate-unit-test-certs
  script:
    - zig build test -j2 -Doptimize=ReleaseSafe --summary all

test-release-fast:
  stage: test
  image: debian:bookworm-slim
  tags:
