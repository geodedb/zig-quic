include:
  # Zig build and test
  - component: gitlab.com/devnw/ci-catalog/zig-build@~latest
    inputs:
      stage: build
      zig_version: '0.15.1'
      build_options: '-Drelease-safe=true cli'
      extra_packages: 'libssl-dev'

  - component: gitlab.com/devnw/ci-catalog/zig-test@~latest
    inputs:
      stage: test
      zig_version: '0.15.1'
      extra_packages: 'libssl-dev'

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@~latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@~latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-secrets@~latest
    inputs:
      stage: security

  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@~latest
    inputs:
      stage: security

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@~latest
    inputs:
      stage: sbom

  - component: gitlab.com/devnw/ci-catalog/sbom-scan@~latest
    inputs:
      stage: sbom
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@~latest
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - build
  - test
  - security
  - sbom
  - release
  - maintenance

# QUIC interoperability testing against other implementations
# Uses GitLab shared runners which support Docker-in-Docker
interop-test:
  stage: test
  image: docker:27
  services:
    - docker:27-dind
  tags:
    - saas-linux-medium-amd64
  needs:
    - job: "zig-build-0.15.1"
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    COMPOSE_PROJECT_NAME: "interop_ci_${CI_JOB_ID}"
  before_script:
    - apk add --no-cache bash git curl
    - mkdir -p ~/.docker/cli-plugins
    - curl -fsSL "https://github.com/docker/compose/releases/download/v2.32.4/docker-compose-linux-x86_64" -o ~/.docker/cli-plugins/docker-compose
    - chmod +x ~/.docker/cli-plugins/docker-compose
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is ready!"
          docker info
          break
        fi
        if [ $i -eq 30 ]; then
          echo "Docker daemon failed to start after 60 seconds"
          exit 1
        fi
        echo "Waiting... ($i/30)"
        sleep 2
      done
    - git clone --depth 1 https://github.com/quic-interop/quic-interop-runner.git examples/interop/quic-interop-runner
    - mkdir -p examples/interop/quic-network-simulator/logs/sim
    - mkdir -p examples/interop/quic-network-simulator/logs/server
    - mkdir -p examples/interop/quic-network-simulator/logs/client
    - mkdir -p examples/interop/quic-network-simulator/www
    - mkdir -p examples/interop/quic-network-simulator/downloads
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/index.html bs=1024 count=1 2>/dev/null
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/5000 bs=5000 count=1 2>/dev/null
    - dd if=/dev/urandom of=examples/interop/quic-network-simulator/www/10000 bs=10000 count=1 2>/dev/null
  script:
    - docker build -f examples/interop/zig-qns/Dockerfile -t zig-qns:local .
    - docker pull martenseemann/quic-go-interop:latest
    - docker pull martenseemann/quic-network-simulator:latest
    - |
      echo "=== Test: Zig server <-> quic-go client (handshake) ==="
      export SERVER_IMAGE="zig-qns:local"
      export CLIENT_IMAGE="martenseemann/quic-go-interop:latest"
      export TESTCASE="handshake"
      docker compose -f examples/interop/docker-compose.full.yml --profile generic up -d sim
      sleep 10
      timeout 120 docker compose -f examples/interop/docker-compose.full.yml --profile generic up --abort-on-container-exit --timeout 30 server client || true
      docker compose -f examples/interop/docker-compose.full.yml --profile generic down -v || true
    - |
      echo "=== Test: quic-go server <-> Zig client (handshake) ==="
      export SERVER_IMAGE="martenseemann/quic-go-interop:latest"
      export CLIENT_IMAGE="zig-qns:local"
      export TESTCASE="handshake"
      docker compose -f examples/interop/docker-compose.full.yml --profile generic up -d sim
      sleep 10
      timeout 120 docker compose -f examples/interop/docker-compose.full.yml --profile generic up --abort-on-container-exit --timeout 30 server client || true
      docker compose -f examples/interop/docker-compose.full.yml --profile generic down -v || true
    - |
      echo "=== Test: Zig server <-> quic-go client (transfer) ==="
      export SERVER_IMAGE="zig-qns:local"
      export CLIENT_IMAGE="martenseemann/quic-go-interop:latest"
      export TESTCASE="transfer"
      docker compose -f examples/interop/docker-compose.full.yml --profile generic up -d sim
      sleep 10
      timeout 120 docker compose -f examples/interop/docker-compose.full.yml --profile generic up --abort-on-container-exit --timeout 30 server client || true
      docker compose -f examples/interop/docker-compose.full.yml --profile generic down -v || true
    - |
      echo "=== Test: quic-go server <-> Zig client (transfer) ==="
      export SERVER_IMAGE="martenseemann/quic-go-interop:latest"
      export CLIENT_IMAGE="zig-qns:local"
      export TESTCASE="transfer"
      docker compose -f examples/interop/docker-compose.full.yml --profile generic up -d sim
      sleep 10
      timeout 120 docker compose -f examples/interop/docker-compose.full.yml --profile generic up --abort-on-container-exit --timeout 30 server client || true
      docker compose -f examples/interop/docker-compose.full.yml --profile generic down -v || true
    - echo "Interop tests completed"
  artifacts:
    when: always
    paths:
      - examples/interop/quic-network-simulator/logs/
    expire_in: 7 days
  allow_failure: true

# Scheduled job to update Go dependencies for interop testing
update-go-dependencies:
  stage: maintenance
  image: golang:1.24
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $UPDATE_GO_DEPS == "true"
  before_script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "ci@devnw.com"
    - git config --global user.name "DevNW CI Bot"
  script:
    - |
      BRANCH_NAME="ci/update-go-deps-$(date +%Y%m%d)"
      git checkout -b "$BRANCH_NAME"

      for dir in quic-test quic-test/xnet-quic test_clients/go examples/interop test-clients/quic-go-client; do
        if [ -f "$dir/go.mod" ]; then
          echo "Updating $dir..."
          cd "$dir"
          go get -u ./... 2>/dev/null || true
          go mod tidy 2>/dev/null || true
          cd "$CI_PROJECT_DIR"
        fi
      done

      if git diff --quiet; then
        echo "No dependency updates available"
        exit 0
      fi

      git add -A
      git commit -m "chore: Update Go dependencies (automated)

      Automated weekly update of Go dependencies for interop testing.

      Co-Authored-By: DevNW CI Bot <ci@devnw.com>"

      git push -o merge_request.create \
               -o merge_request.title="chore: Update Go dependencies" \
               -o merge_request.description="Automated weekly update of Go dependencies for interop testing." \
               -o merge_request.remove_source_branch \
               origin "$BRANCH_NAME"

      echo "Created merge request for dependency updates"
  allow_failure: true
