      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/

release-windows-x64:
  stage: release
  tags:
    - saas-windows-medium-amd64
  variables:
    GIT_STRATEGY: none
    GIT_SUBMODULE_STRATEGY: none
  cache:
    key: "windows-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    # Manual clone with sparse checkout
    - |
      if (Test-Path ".git") { Remove-Item -Recurse -Force .git }
      if (Test-Path "src") { Remove-Item -Recurse -Force src }
    - git clone --no-checkout --depth 20 --filter=blob:none "${env:CI_REPOSITORY_URL}" .
    - git config core.sparseCheckout true
    - |
      @"
      /*
      !/sha512:*
      "@ | Out-File -Encoding ascii .git/info/sparse-checkout
    - git checkout "${env:CI_COMMIT_SHA}"
    - |
      $tokenUrl = "https://gitlab-ci-token:${env:CI_JOB_TOKEN}@gitlab.com/"
      if (Test-Path .gitmodules) {
        (Get-Content .gitmodules) -replace 'git@gitlab.com:', $tokenUrl | Set-Content .gitmodules
      }
    - git submodule sync
    - git submodule update --init --depth 1
    - |
      Get-ChildItem -Recurse -Filter .gitmodules | ForEach-Object {
        $dir = $_.DirectoryName
        $tokenUrl = "https://gitlab-ci-token:${env:CI_JOB_TOKEN}@gitlab.com/"
        (Get-Content $_.FullName) -replace 'git@gitlab.com:', $tokenUrl | Set-Content $_.FullName
        Push-Location $dir
        git submodule sync
        Pop-Location
      }
    - git submodule update --init --recursive --depth 1
    # Install Zig
    - |
      if (!(Test-Path "zig-${env:ZIG_VERSION}\zig.exe")) {
        Invoke-WebRequest -Uri "https://ziglang.org/download/${env:ZIG_VERSION}/zig-x86_64-windows-${env:ZIG_VERSION}.zip" -OutFile "zig.zip"
        Expand-Archive -Path "zig.zip" -DestinationPath "."
        Rename-Item "zig-x86_64-windows-${env:ZIG_VERSION}" "zig-${env:ZIG_VERSION}"
      }
    - $env:PATH = "$PWD\zig-${env:ZIG_VERSION};$env:PATH"
  script:
    - $env:PATH = "$PWD\zig-${env:ZIG_VERSION};$env:PATH"
    - zig build -Dtarget=x86_64-windows-msvc -Doptimize=ReleaseSafe cli
    - New-Item -ItemType Directory -Force -Path dist
    - Compress-Archive -Path zig-out/bin/* -DestinationPath "dist/quic-windows-x86_64-${env:CI_COMMIT_TAG}.zip"
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/

release-windows-arm64:
  stage: release
  <<: *zig-linux-template
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build -Dtarget=aarch64-windows-msvc -Doptimize=ReleaseSafe cli
    - mkdir -p dist
    - apt-get install -y zip
    - cd zig-out/bin && zip -r "../../dist/quic-windows-arm64-${CI_COMMIT_TAG}.zip" .
  artifacts:
    paths:
      - dist/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/

# Collect all release artifacts and create GitLab release
publish-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release-linux-x64
      artifacts: true
    - job: release-linux-arm64
      artifacts: true
    - job: release-linux-arm
      artifacts: true
    - job: release-linux-riscv64
      artifacts: true
    - job: release-macos-arm64
      artifacts: true
    - job: release-macos-x64
      artifacts: true
    - job: release-windows-x64
      artifacts: true
    - job: release-windows-arm64
      artifacts: true
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
    - ls -la dist/
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: "quic-linux-x86_64-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/quic-linux-x86_64-${CI_COMMIT_TAG}.tar.gz"
        - name: "quic-linux-arm64-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/quic-linux-arm64-${CI_COMMIT_TAG}.tar.gz"
        - name: "quic-linux-arm-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/quic-linux-arm-${CI_COMMIT_TAG}.tar.gz"
        - name: "quic-linux-riscv64-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/quic-linux-riscv64-${CI_COMMIT_TAG}.tar.gz"
        - name: "quic-macos-arm64-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/quic-macos-arm64-${CI_COMMIT_TAG}.tar.gz"
        - name: "quic-macos-x86_64-${CI_COMMIT_TAG}.tar.gz"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/quic-macos-x86_64-${CI_COMMIT_TAG}.tar.gz"
        - name: "quic-windows-x86_64-${CI_COMMIT_TAG}.zip"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/quic-windows-x86_64-${CI_COMMIT_TAG}.zip"
        - name: "quic-windows-arm64-${CI_COMMIT_TAG}.zip"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/dist/quic-windows-arm64-${CI_COMMIT_TAG}.zip"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
