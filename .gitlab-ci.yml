test-release-small:
  stage: test
  image: debian:bookworm-slim
  tags:
    - company
    - linux
    - x86
  # ReleaseSmall compile on the full quic test graph consistently brushes the
  # default 1h runner timeout on shared runners. Extend to 2h.
  timeout: 2h
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "zig-cache-${ZIG_VERSION}"
    paths:
      - zig-cache/
      - .zig-cache/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev openssl
    - *install-zig
    - *generate-unit-test-certs
  script:
