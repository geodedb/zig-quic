# NOTE: Build/test skipped - requires Zig 0.15.x which is not yet released.
# Security scanning is enabled.

include:
  # Security scanning (Advanced SAST enabled by default)
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1
    inputs:
      allow_failure: true

stages:
  - security
  - sbom
  - maintenance

# Scheduled job to update Go dependencies for interop testing
# This runs weekly and creates a merge request if updates are available
update-go-dependencies:
  stage: maintenance
  image: golang:1.24
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $UPDATE_GO_DEPS == "true"
  before_script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "ci@devnw.com"
    - git config --global user.name "DevNW CI Bot"
  script:
    - |
      # Create a branch for the updates
      BRANCH_NAME="ci/update-go-deps-$(date +%Y%m%d)"
      git checkout -b "$BRANCH_NAME"

      UPDATED=false

      # Update each Go module
      for dir in quic-test quic-test/xnet-quic test_clients/go examples/interop test-clients/quic-go-client; do
        if [ -f "$dir/go.mod" ]; then
          echo "Updating $dir..."
          cd "$dir"
          go get -u ./... 2>/dev/null || true
          go mod tidy 2>/dev/null || true
          cd "$CI_PROJECT_DIR"
        fi
      done

      # Check if there are changes
      if git diff --quiet; then
        echo "No dependency updates available"
        exit 0
      fi

      # Commit and push changes
      git add -A
      git commit -m "chore: Update Go dependencies (automated)

      Automated weekly update of Go dependencies for interop testing.

      Co-Authored-By: DevNW CI Bot <ci@devnw.com>"

      git push -o merge_request.create \
               -o merge_request.title="chore: Update Go dependencies" \
               -o merge_request.description="Automated weekly update of Go dependencies for interop testing." \
               -o merge_request.remove_source_branch \
               origin "$BRANCH_NAME"

      echo "Created merge request for dependency updates"
  allow_failure: true

