    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    GOTOOLCHAIN: "auto"
    GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
    GOCACHE: "$CI_PROJECT_DIR/.cache/go/build"
  cache:
    key: "e2e-go-cache"
    paths:
      - .cache/go/pkg/mod
      - .cache/go/build
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl
    # Build Go client (GOTOOLCHAIN=auto allows downloading newer Go if needed)
    - cd test-clients/quic-go-client && go build -o quic-go-test-client . && cd ../..
    # Generate test certificates
    - *generate-test-certs
  script:
    # Server binary already built by build job
    - ls -la zig-out/bin/
    # Start server
    - ./zig-out/bin/quic-server --bind 127.0.0.1:4433 --cert server-cert.pem --key server-key.pem --insecure > /tmp/server.log 2>&1 &
    - SERVER_PID=$!
    - sleep 3
    # Run Go client
    - cd test-clients/quic-go-client
    - ./quic-go-test-client -addr 127.0.0.1:4433 -verbose 2>&1 | tee /tmp/client.log
    - kill $SERVER_PID 2>/dev/null || true
    # Check for success
    - grep -q "Test completed successfully" /tmp/client.log
  artifacts:
    when: always
    paths:
      - /tmp/*.log
    expire_in: 7 days

e2e-test-rust:
  stage: e2e
  image: rust:1.83
  tags:
    - saas-linux-medium-amd64
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
