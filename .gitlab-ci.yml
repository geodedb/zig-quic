security-rust-cargo-audit:
  stage: security
  image: rust:1.99
  tags:
    - company
    - linux
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - |
      for attempt in 1 2 3; do
        cargo install cargo-audit --locked --version 0.22.0 && break
        if [ "$attempt" -eq 3 ]; then
          echo "cargo-audit install failed after retries" >&2
          exit 1
        fi
        echo "Retrying cargo-audit install (${attempt}/3)..." >&2
        sleep 5
      done
    - sh scripts/check-client-security.sh rust

