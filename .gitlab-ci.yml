e2e-test-python:
  stage: e2e
  image: python:3.12-slim
  tags:
    - saas-linux-medium-amd64
  needs:
    - job: build
      artifacts: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key: "e2e-python-pip"
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends openssl
    # Install pinned Python deps for aioquic test client
    - pip install -r test-clients/aioquic-client/requirements.txt
    # Generate test certificates
    - *generate-test-certs
  script:
    # Server binary already built by build job
    - ls -la zig-out/bin/
    # Start server
    - ./zig-out/bin/quic-server --bind 127.0.0.1:4433 --cert server-cert.pem --key server-key.pem --insecure > /tmp/server.log 2>&1 &
    - SERVER_PID=$!
    - sleep 3
    # Run Python client
    - cd test-clients/aioquic-client
    - python test_client.py --host 127.0.0.1 --port 4433 2>&1 | tee /tmp/client.log
    - kill $SERVER_PID 2>/dev/null || true
    # Check for success
    - grep -q "Test completed successfully" /tmp/client.log
  artifacts:
    when: always
    paths:
      - /tmp/*.log
    expire_in: 7 days

e2e-test-go:
  stage: e2e
  image: golang:1.25.8
  tags:
    - saas-linux-medium-amd64
  needs:
    - job: build
      artifacts: true
  rules:
