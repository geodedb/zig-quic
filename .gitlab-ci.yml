security-rust-cargo-audit:
  stage: security
  image: rust:1.99
  tags:
    - company
    - linux
    - x86
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  cache:
    key: "quic-cargo-audit-0.22.2-rust1.99-linux-x86_64-v1"
    paths:
      - .cache/cargo-audit/
  script:
    - export PATH="$CI_PROJECT_DIR/.cache/cargo-audit/bin:$PATH"
    - |
      audit_bin="$CI_PROJECT_DIR/.cache/cargo-audit/bin/cargo-audit"
      if [ "$("$audit_bin" --version 2>/dev/null || true)" != "cargo-audit 0.22.2" ]; then
        for attempt in 1 2 3; do
          cargo install --root "$CI_PROJECT_DIR/.cache/cargo-audit" cargo-audit --locked --version 0.22.2 --force && break
          if [ "$attempt" -eq 3 ]; then
            echo "cargo-audit install failed after retries" >&2
            exit 1
          fi
          echo "Retrying cargo-audit install (${attempt}/3)..." >&2
          sleep 5
        done
      fi
      test "$("$audit_bin" --version)" = "cargo-audit 0.22.2"
    - sh scripts/check-client-security.sh rust

