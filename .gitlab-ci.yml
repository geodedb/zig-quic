workflow:
  rules:
  - if: $CI_COMMIT_BRANCH == "ci/quic-linux-progress-diagnostic-20261025"
  - when: never
stages:
- test
variables:
  ZIG_VERSION: 0.16.0
progress-diagnostic:
  stage: test
  image: debian:bookworm-slim
  tags:
  - company
  - linux
  - x86
  - aws-spot
  timeout: 20m
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends libssl-dev
  - apt-get update && apt-get install -y curl xz-utils python3
  - "if [ ! -f \"zig-${ZIG_VERSION}/zig\" ]; then\n  ARCH=$(uname -m)\n  case \"$ARCH\"\
    \ in\n    x86_64)  ZIG_ARCH=\"x86_64\" ;;\n    aarch64) ZIG_ARCH=\"aarch64\" ;;\n\
    \    arm64)   ZIG_ARCH=\"aarch64\" ;;\n    *)       echo \"Unsupported architecture:\
    \ $ARCH\"; exit 1 ;;\n  esac\n  MAJOR=$(echo \"$ZIG_VERSION\" | cut -d. -f1)\n\
    \  MINOR=$(echo \"$ZIG_VERSION\" | cut -d. -f2)\n  if [ \"$MAJOR\" -eq 0 ] &&\
    \ [ \"$MINOR\" -lt 15 ]; then\n    ARCHIVE_NAME=\"zig-linux-${ZIG_ARCH}-${ZIG_VERSION}\"\
    \n  else\n    ARCHIVE_NAME=\"zig-${ZIG_ARCH}-linux-${ZIG_VERSION}\"\n  fi\n  TARBALL=\"\
    ${ARCHIVE_NAME}.tar.xz\"\n  INDEX_FILE=$(mktemp)\n  curl -fsSL \"https://ziglang.org/download/index.json\"\
    \ -o \"${INDEX_FILE}\"\n  EXPECTED_HASH=$(ZIG_VER=\"${ZIG_VERSION}\" ZIG_ARCH_KEY=\"\
    ${ZIG_ARCH}-linux\" ZIG_IDX=\"${INDEX_FILE}\" \\\n    python3 -c \"\nimport json,\
    \ os, sys\nidx = json.load(open(os.environ['ZIG_IDX']))\npkg = idx.get(os.environ['ZIG_VER'],\
    \ {}).get(os.environ['ZIG_ARCH_KEY'], {})\nh = pkg.get('shasum', '')\nif not h:\
    \ sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])\n\
    print(h)\n\")\n  rm -f \"${INDEX_FILE}\"\n  curl -fsSL \"https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}\"\
    \ -o \"${TARBALL}\"\n  echo \"${EXPECTED_HASH}  ${TARBALL}\" | sha256sum --check\
    \ --strict\n  tar -xJf \"${TARBALL}\"\n  mv \"${ARCHIVE_NAME}\" \"zig-${ZIG_VERSION}\"\
    \n  rm -f \"${TARBALL}\"\nfi\n"
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version
  script:
  - python3 -u scripts/diagnose_concurrent_streams.py
  artifacts:
    when: always
    paths:
    - progress-diagnostics/
    expire_in: 1 week
