    - for dir in examples/interop test-clients/quic-test-legacy/xnet-quic test-clients/quic-go-client test-clients/legacy-clients/go; do echo "Scanning $dir"; (cd "$dir" && go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...); done
    - |
      echo "Scanning test-clients/quic-test-legacy (standalone binaries)"
      cd test-clients/quic-test-legacy
      for src in client.go server.go test_client.go test_client_comprehensive.go; do
        out="/tmp/quic-test-legacy-${src%.go}"
        go build -o "$out" "./$src"
        go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -mode=binary "$out"
      done

# Scheduled job to update Go dependencies for interop testing
update-go-dependencies:
  stage: maintenance
  image: golang:1.27.3
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $UPDATE_GO_DEPS == "true"
  before_script:
    - apt-get update && apt-get install -y git
    - git config --global user.email "ci@devnw.com"
    - git config --global user.name "DevNW CI Bot"
  script:
    - |
      BRANCH_NAME="ci/update-go-deps-$(date +%Y%m%d)"
      git checkout -b "$BRANCH_NAME"

      for dir in test-clients/quic-test-legacy test-clients/quic-test-legacy/xnet-quic test-clients/legacy-clients/go examples/interop test-clients/quic-go-client; do
        if [ -f "$dir/go.mod" ]; then
          echo "Updating $dir..."
          cd "$dir"
          go get -u ./... 2>/dev/null || true
          go mod tidy 2>/dev/null || true
          cd "$CI_PROJECT_DIR"
        fi
      done

      if git diff --quiet; then
        echo "No dependency updates available"
        exit 0
      fi

      git add -A
      git commit -m "chore: Update Go dependencies (automated)

      Automated weekly update of Go dependencies for interop testing.

      Co-Authored-By: DevNW CI Bot <ci@devnw.com>"

      git push -o merge_request.create \
               -o merge_request.title="chore: Update Go dependencies" \
               -o merge_request.description="Automated weekly update of Go dependencies for interop testing." \
               -o merge_request.remove_source_branch \
               origin "$BRANCH_NAME"

      echo "Created merge request for dependency updates"
  allow_failure: true

# Synthetic measurements verify gate decisions; this is not a performance run.
