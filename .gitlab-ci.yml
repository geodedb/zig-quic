variables:
  ZIG_VERSION: "0.15.2"

# Install Zig with SHA-256 verification via python3
.install-zig: &install-zig
  - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl python3 xz-utils
  - ZIG_ARCHIVE="zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
  - ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_ARCHIVE}"
  - ZIG_SHA256_URL="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz.minisig"
  - curl -fsSLO "${ZIG_URL}"
  - curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/sha256sums.txt" -o sha256sums.txt
  - python3 -c "
    import hashlib, sys
    digest = hashlib.sha256(open('${ZIG_ARCHIVE}', 'rb').read()).hexdigest()
    expected = [l.split()[0] for l in open('sha256sums.txt') if '${ZIG_ARCHIVE}' in l]
    if not expected:
        sys.exit('SHA-256 entry not found for ${ZIG_ARCHIVE}')
    if digest != expected[0]:
        sys.exit(f'SHA-256 mismatch: got {digest}, expected {expected[0]}')
    print(f'SHA-256 verified: {digest}')
    "
  - tar -xf "${ZIG_ARCHIVE}"
  - export PATH="$PWD/zig-x86_64-linux-${ZIG_VERSION}:$PATH"
  - zig version

# zig-format component override: inject Zig install before format check
zig-format:
  before_script:
    - *install-zig

# E2E tests with multiple QUIC client implementations
# Tests Python (aioquic), Go (quic-go), Rust (quinn), and Zig clients
# Generate test certificates for E2E tests
.generate-test-certs: &generate-test-certs
  - |
    openssl ecparam -genkey -name prime256v1 -out server-key.pem
    openssl req -new -x509 -key server-key.pem -out server-cert.pem -days 1 \
      -subj "/CN=localhost/O=Test/C=US" \
      -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

build:
  stage: build
  image: debian:bookworm-slim
  tags:
    - saas-linux-medium-amd64
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libssl-dev
    - *install-zig
  script:
    - zig build
  artifacts:
    paths:
      - zig-out/
    expire_in: 1 day

