stages:
- test
variables:
  ZIG_VERSION: 0.16.0
stress-integration-20x:
  stage: test
  image: debian:bookworm-slim
  tags:
  - company
  - k8s
  - linux
  cache:
    key: zig-cache-${ZIG_VERSION}
    paths:
    - zig-cache/
    - .zig-cache/
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends git libssl-dev jq
  - - apt-get update && apt-get install -y curl xz-utils python3
    - "if [ ! -f \"zig-${ZIG_VERSION}/zig\" ]; then\n  ARCH=$(uname -m)\n  case \"\
      $ARCH\" in\n    x86_64)  ZIG_ARCH=\"x86_64\" ;;\n    aarch64) ZIG_ARCH=\"aarch64\"\
      \ ;;\n    arm64)   ZIG_ARCH=\"aarch64\" ;;\n    *)       echo \"Unsupported\
      \ architecture: $ARCH\"; exit 1 ;;\n  esac\n  MAJOR=$(echo \"$ZIG_VERSION\"\
      \ | cut -d. -f1)\n  MINOR=$(echo \"$ZIG_VERSION\" | cut -d. -f2)\n  if [ \"\
      $MAJOR\" -eq 0 ] && [ \"$MINOR\" -lt 15 ]; then\n    ARCHIVE_NAME=\"zig-linux-${ZIG_ARCH}-${ZIG_VERSION}\"\
      \n  else\n    ARCHIVE_NAME=\"zig-${ZIG_ARCH}-linux-${ZIG_VERSION}\"\n  fi\n\
      \  TARBALL=\"${ARCHIVE_NAME}.tar.xz\"\n  INDEX_FILE=$(mktemp)\n  curl -fsSL\
      \ \"https://ziglang.org/download/index.json\" -o \"${INDEX_FILE}\"\n  EXPECTED_HASH=$(ZIG_VER=\"\
      ${ZIG_VERSION}\" ZIG_ARCH_KEY=\"${ZIG_ARCH}-linux\" ZIG_IDX=\"${INDEX_FILE}\"\
      \ \\\n    python3 -c \"\nimport json, os, sys\nidx = json.load(open(os.environ['ZIG_IDX']))\n\
      pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})\n\
      h = pkg.get('shasum', '')\nif not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER']\
      \ + '/' + os.environ['ZIG_ARCH_KEY'])\nprint(h)\n\")\n  rm -f \"${INDEX_FILE}\"\
      \n  curl -fsSL \"https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}\" -o\
      \ \"${TARBALL}\"\n  echo \"${EXPECTED_HASH}  ${TARBALL}\" | sha256sum --check\
      \ --strict\n  tar -xJf \"${TARBALL}\"\n  mv \"${ARCHIVE_NAME}\" \"zig-${ZIG_VERSION}\"\
      \n  rm -f \"${TARBALL}\"\nfi\n"
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
  script:
  - mkdir -p stress-results
  - zig build
  - "set -e\nFAILED=0\nfor suite in handshake_e2e stream_throughput conn_scale; do\n\
    \  echo \"=== 20x stress: ${suite} ===\"\n  for i in $(seq -w 1 20); do\n    OUT=\"\
    stress-results/${suite}_round_${i}.json\"\n    if ! zig build bench -- --suite=${suite}\
    \ --output=${OUT}; then\n      echo \"[stress] FAIL: ${suite} round ${i} exited\
    \ non-zero\"\n      FAILED=$((FAILED+1))\n      continue\n    fi\n    # Reject\
    \ any SKIP row (indicates setup / toolchain failure).\n    if jq -e '.rows[] |\
    \ select(.variant | endswith(\"-SKIP\"))' \"${OUT}\" >/dev/null; then\n      echo\
    \ \"[stress] FAIL: ${suite} round ${i} produced SKIP row(s) -- setup failure\"\
    \n      FAILED=$((FAILED+1))\n    fi\n  done\ndone\nif [ \"${FAILED}\" -gt 0 ];\
    \ then\n  echo \"[stress] REJECT: ${FAILED} round(s) failed across 60 total (3\
    \ suites x 20 rounds)\"\n  exit 1\nfi\necho \"[stress] PASS: all 60 rounds completed\
    \ cleanly\"\n"
  artifacts:
    when: always
    paths:
    - stress-results/
    expire_in: 30 days
