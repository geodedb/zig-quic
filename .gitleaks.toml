# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2024-2025 CodePros
#
# SECURITY NOTE: This configuration is intentionally restrictive.
# Only specific test fixture paths are allowed. Do not add blanket
# file extension allowlists (e.g., .*\.key$) as this defeats the
# purpose of secret detection.

title = "Gitleaks Configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowlist for known test fixtures and false positives"

# Only allow specific paths for test certificates - NOT blanket extensions
paths = [
  # PEM parsing source code (contains header string literals, not actual keys)
  '''src/quic/pem\.zig$''',
  # Explicit test/local fixture keys used for TLS integration/e2e scaffolding.
  # These are non-production development fixtures.
  '''certs/key\.pem$''',
  '''certs/server\.key$''',
  '''clients/python/examples/interop/certs/key\.pem$''',
  '''data/server\.key$''',
  '''tests/certs/self-signed/key\.pem$''',
  '''tests/certs/self-signed/key_rsa\.pem$''',
  '''tests/certs/valid/key\.pem$''',
  '''tests/certs/valid/key_rsa\.pem$''',
  # RFC test vectors and token negative tests that trigger generic-api-key heuristics.
  '''tests/test_tls_key_schedule\.zig$''',
  '''tests/unit/endpoint/test_server\.zig$''',
  '''tests/unit/endpoint/test_handshake_integration\.zig$''',
  # Zig build artifacts (not source)
  '''\.zig-cache/.*''',
  '''zig-out/.*''',
  # RFC specification documents (may contain example keys)
  '''specs/.*\.txt$''',
]

# Stopwords for variable/function names that contain "secret" but are not secrets
# These are legitimate code identifiers, not actual credentials
stopwords = [
  # QUIC/TLS key derivation variable names (RFC 9001)
  "ecdhe_secret",
  "initial_secret",
  "client_secret",
  "server_secret",
  "handshake_secret",
  "master_secret",
  "app_rx_secret",
  "app_tx_secret",
  "early_secret",
  # Key derivation function names
  "deriveKeyIvHp",
  "derive_secret",
  "expandLabel",
  "hkdf_expand",
  # Test fixture variable names
  "test_client_secret",
  "test_server_secret",
  "test_secret",
  # Certificate field names
  "keyCertSign",
  "keyEncipherment",
  "digitalSignature",
  # QUIC transport parameter names
  "stateless_reset_token",
  "token_secret",
]

# NOTE: Do not commit private keys (even for tests).
# Keep any locally generated certificates untracked via `.gitignore` and prefer
# generating test certs at runtime (CI) or using public test vectors.

# Historical public OpenSSL signing-key identifiers, not API credentials.
# Require both the exact value and installer path; do not exclude the file.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public OpenSSL release signing-key fingerprints in the installer"
condition = "AND"
paths = ['''^scripts/install-openssl-fips\.sh$''']
regexTarget = "secret"
regexes = [
    '''^B146647E45A7B33947AB226B2A2C87D161692D40$''',
    '''^BA5473A2B0587B07FB27CF2D216094DFD0CB81EF$''',
]
