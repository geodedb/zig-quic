# GitLab Secret Detection Configuration
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2024-2025 CodePros
#
# This file configures GitLab's secret detection to skip locally generated
# test certificates and other non-sensitive cryptographic material.

ruleset:
  - id: gitleaks-generic-api-key
    disabled: false
  - id: gitleaks-private-key
    disabled: false

# Paths to exclude from secret scanning
# These contain local test artifacts (not committed)
path_exclusions:
  - "tests/certs/**"
  - "examples/interop/certs/**"
