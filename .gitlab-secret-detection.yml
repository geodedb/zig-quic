# GitLab Secret Detection Configuration
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2024-2025 CodePros
#
# This file configures GitLab's secret detection to skip locally generated
# test certificates and other non-sensitive cryptographic material.

ruleset:
  - id: gitleaks-generic-api-key
    disabled: false
  - id: gitleaks-private-key
    disabled: false

# SECURITY NOTE:
# Do not exclude paths from secret scanning. If developers generate local test
# certificates, keep them untracked/ignored via `.gitignore` (e.g. `*.key`,
# `*.pem`) rather than creating scan bypasses for committed secrets.
