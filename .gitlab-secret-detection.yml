# GitLab Secret Detection Configuration
# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2024-2025 CodePros
#
# This file configures GitLab's secret detection to skip test certificates
# and other non-sensitive cryptographic material used for testing.

ruleset:
  - id: gitleaks-generic-api-key
    disabled: false
  - id: gitleaks-private-key
    disabled: false

# Paths to exclude from secret scanning
# These contain test certificates and keys that are intentionally committed
path_exclusions:
  - "server.crt"
  - "server.key"
  - "tests/certs/**/*"
  - "*.pem"
  - "*.crt"
  - "*.der"
  - "*.key"
  - "testdata/**/*"
